# =============================================================================
# .assistant/pipeline-synthesis.cron.yaml
# =============================================================================
# Per-profile CRON jobs for the Pipeline Synthesis assistant.
# Per operator 2026-05-09 turn 7 (sacrosanct, verbatim):
#   "list of CRON jobs that can be enabled or disabled and configured by AI
#   assistant profile to enable other per-profile specific or even other global
#   CRON jobs which can enable for example noticing certain delta and stuff like
#   that or morning or evening tasks or start of week and end of week tasks and
#   so on."
#
# Each job: enabled (toggle) · schedule (systemd-timer OnCalendar syntax) ·
# trigger (what the assistant DOES when fired) · description (what + why).
#
# Enable a job:   `tools/assistant cron enable pipeline-synthesis <job-name>`
# Disable a job:  `tools/assistant cron disable pipeline-synthesis <job-name>`
# List jobs:      `tools/assistant cron list pipeline-synthesis`
# Install timers: `tools/assistant cron install pipeline-synthesis`
#                 (creates systemd .timer units that fire the agent's
#                  scheduled-task entry point)
# =============================================================================

profile: pipeline-synthesis

jobs:

  # ─── Hourly: drain the unsynthesized-raw backlog ──────────────────────
  - name: backlog-process-top
    enabled: true
    schedule: "hourly"
    trigger:
      type: openclaw-task
      prompt: |
        Operator-stated job (verbatim, sacrosanct): "Another could be synthesize
        the ingested information still not at the end of the pipeline...."

        This is NOT "process 1 raw and defer the rest." The job is to DRAIN the
        backlog steadily — process as many raws as you can in a reasonable budget.
        Single-raw budget-capped processing creates silent-tyranny backlog growth.

        Workflow per tick:

        0. **Operator-directives check (FIRST thing on wake).** Read
           .assistant/_state/pipeline-synthesis-operator-directives.md (if it
           exists). NEVER overwrite this file — only append `> [!processed]`
           markers below directives you handle.

           a. `> [!directive]` callouts NOT already followed by `> [!processed]`.
              Process WITHIN autonomy (AUTONOMY.md). Surfacing-required ones
              get a `> [!info]` follow-up. Mark `> [!processed]` when done.

           b. `> [!resolved] Q##` callouts. Don't re-surface these.

           After step 0, proceed with normal backlog drain:

        1. Scan raw/articles/, raw/transcripts/, raw/papers/, raw/dumps/.
           SKIP raw/notes/ (forbidden_inputs — sacrosanct operator-directive records).

        2. For each raw file, check if a corresponding wiki/sources/<domain>/src-*.md
           exists (use wiki_search by raw filename slug; check the actual filesystem).
           Build a set of unsynthesized raws.

        3. Pick the 3-5 OLDEST unsynthesized raws (FIFO discipline).

        4. For EACH selected raw:
           a. Read it IN FULL (Hard Rule 1; wc -l first; offset reads for >200 lines).
           b. Determine target domain (ai-models / tools-integration / wiki-methodology / ecosystem-projects).
           c. Author source-synthesis at wiki/sources/<domain>/src-<slug>.md per template:
              - 9 required frontmatter fields (title, type=source-synthesis, domain, status, confidence, created, updated, sources, tags)
              - Summary (≥30 words) + Key Insights + Relationships sections
              - ≥1 explicit relationship verb to an existing wiki page (BUILDS ON · COMPLEMENTS · RELATES TO · etc.)
              - ≥0.25 line ratio (page lines / raw lines)
              - Reference card callout with source URL + ingest date

        5. Run pipeline_crossref to discover additional connections.

        6. Run pipeline_post — 0 errors required. If errors, fix them in your
           synthesis (don't bypass; don't claim done with errors).

        7. Append one line to .assistant/_state/pipeline-synthesis-inbox.md:
           "HH:MM | <count> raws synthesized | <count> cross-refs added | pipeline_post status"

        Budget: target 5-10 minutes model time per tick. Larger raws (arxiv
        papers) may consume the whole budget on one item — that's fine. Smaller
        articles (3-5K word blogs) should process 3-5 per tick.

        ANTI-PATTERN: writing a wiki/log/ entry that says "I noted N unsynthesized
        raws, processed 1, deferring the rest." Don't. Either you processed them
        or you didn't surface that you saw them. The backlog drain rate is the
        success metric — slower drainage than ingestion is a failure_signal.
    description: "Hourly backlog drainage — process 3-5 oldest unsynthesized raws end-to-end (no diary-defer)."
    timeout_seconds: 1200  # 20 min — processing 3-5 raws each ~3-5 min

  # ─── Morning: deep batch drain of yesterday's accumulated backlog ─────
  - name: morning-batch-process
    enabled: true
    schedule: "*-*-* 07:00:00"
    trigger:
      type: openclaw-task
      prompt: |
        Daily morning batch — drain ALL accumulated unsynthesized raws from the
        previous 16-24 hours. Hourly ticks process 3-5 raws; this morning batch
        is the catch-up that ensures the backlog actually shrinks vs grows.

        Workflow:

        1. Scan raw/articles/, raw/transcripts/, raw/papers/, raw/dumps/.
           SKIP raw/notes/ (forbidden_inputs).

        2. Identify the FRESH batch (mtime within last 16 hours — these are
           raws Continuous Research fetched overnight) AND any stragglers
           from the older backlog.

        3. Process the fresh batch FIRST (LIFO for newly-fetched). Process
           older stragglers after, FIFO. Goal: by end of run, the count of
           unsynthesized raws older than 24h is 0 or near-0.

        4. For each raw, follow steps 4a-4c from backlog-process-top
           (read-in-full, author source-synthesis per template, pipeline_crossref).

        5. Run pipeline_post after the batch (not after every single file —
           batch the validation pass).

        6. Write a wiki/log/<date>-pipeline-synthesis-morning.md summary
           (this is a session-summary log, NOT a diary-defer log — it
           reports actual work done, with counts + file paths):
             - raws processed (count + slugs)
             - syntheses authored (count + average ratio)
             - cross-references added (count)
             - pipeline_post status (must be 0 errors)
             - promotion candidates surfaced (count + slugs) — to operator-decision-queue.md
             - deduplication candidates surfaced (count + slugs)
             - remaining unsynthesized count (target: trending toward 0)

        Budget: target up to 30 minutes model time. If backlog is large, prioritize
        breadth (synthesize all freshly-fetched raws shallow first) over depth
        (long synthesis of one item). The hourly ticks fill in depth.
    description: "Daily morning batch — drains yesterday's accumulated backlog; ensures shrink > growth."
    timeout_seconds: 2700  # 45 min — large batch drain

  # ─── Evening: backlog status report ───────────────────────────────────
  - name: evening-backlog-report
    enabled: true
    schedule: "*-*-* 21:00:00"    # daily at 21:00 (after Continuous Research's evening-report)
    trigger:
      type: openclaw-task
      prompt: |
        End-of-day backlog status report. Compute:
          - Total unsynthesized raws (by domain: articles / transcripts / papers / dumps)
          - Oldest unsynthesized raw age (days)
          - Net change vs yesterday (+N new ingested, -N synthesized = -delta)
          - Anti-signals (backlog GROWING is a failure_signal)
        Write to wiki/log/<date>-pipeline-synthesis-evening-backlog.md. If the
        backlog is growing instead of shrinking, surface as anti-signal in
        operator-decision-queue.md.
    description: "Daily evening backlog metrics — drain rate + anti-signal surfacing."
    timeout_seconds: 600  # 10 min — metrics + summary log

  # ─── Weekly Monday: backlog deep-audit ────────────────────────────────
  - name: start-of-week-backlog-audit
    enabled: true
    schedule: "Mon *-*-* 10:00:00"  # Monday at 10:00
    trigger:
      type: openclaw-task
      prompt: |
        Weekly start-of-week backlog deep-audit:
          1. Identify STALE raws (unsynthesized >14 days) — may be deprioritizable
             (operator-decision) or may indicate Profile is failing
          2. Identify DEDUPLICATION candidates (multiple raws covering same topic)
             — surface to operator-decision-queue with suggested merge plan
          3. Identify PROMOTION candidates (raws suggesting higher-layer content:
             lesson, pattern, decision) — surface to operator-decision-queue
          4. Identify SCHEMA-failing raws (cannot satisfy ≥0.25 ratio because raw
             too thin) — surface as quality-floor candidates (drop or augment)
        Write wiki/log/<date>-pipeline-synthesis-weekly-audit.md.
    description: "Weekly Monday deep-audit — stale / dedup / promotion / schema-failing surfacing."
    timeout_seconds: 1800  # 30 min — backlog audit work

  # ─── Weekly Friday: synthesis output digest ───────────────────────────
  - name: end-of-week-synthesis-digest
    enabled: true
    schedule: "Fri *-*-* 17:30:00"  # Friday at 17:30
    trigger:
      type: openclaw-task
      prompt: |
        End-of-week synthesis output digest:
          - Total syntheses authored this week (count)
          - Average line ratio (target ≥0.25; report distribution)
          - Cross-references added (count + per-page average)
          - Pipeline post error count (target = 0)
          - Promotion candidates surfaced + operator accept-rate
          - Deduplication candidates surfaced + operator accept-rate
          - Backlog drain rate (raws processed / raws ingested this week)
        Write to wiki/log/<date>-pipeline-synthesis-weekly-digest.md. Flag any
        anti-signals from Profile.success_criteria.anti_signals_to_watch.
    description: "Weekly Friday digest — synthesis output metrics + anti-signal surfacing."
    timeout_seconds: 1200  # 20 min — weekly digest

  # ─── Monthly: budget audit ────────────────────────────────────────────
  - name: monthly-budget-audit
    enabled: true
    schedule: "*-*-01 13:00:00"   # 1st of each month at 13:00
    trigger:
      type: openclaw-task
      prompt: |
        Monthly budget audit. Estimate this Profile's value-output for the month
        vs Profile.model_routing.cost_ceilings.target_monthly_value_output_usd_equivalent
        ($30-60 target; $100 hard-stop). Compare actual spend to
        synthesis-count value-equivalent. If over hard_stop, alert. Report to
        wiki/log/<date>-pipeline-synthesis-monthly-budget.md.
    description: "Monthly cost/value audit per Profile.success_criteria.measurable_value_per_month."
    timeout_seconds: 600  # 10 min — monthly audit

# =============================================================================
# Job-design rules
# =============================================================================
# 1. Each job is OFF by default (`enabled: false`) — operator opts in.
# 2. Schedules use systemd OnCalendar syntax (man systemd.time).
# 3. Triggers are abstract; the consuming runtime (OpenClaw / Multica / etc.)
#    translates `type` + `prompt` into its native invocation.
# 4. Heavy jobs (deep-audit, weekly-digest) should respect the Profile's cost ceiling.
# 5. Per Profile.action_surface, jobs may NOT auto-promote maturity tiers or
#    write to operator-territory files. They surface; operator decides.
# 6. Coordination with Continuous Research Profile: morning-batch-process runs
#    BEFORE Continuous Research's morning-scan (07:00 vs 08:00), so fresh raws
#    from yesterday's evening-fetches get synthesized before today's research
#    surfaces new ones. Evening-backlog-report runs AFTER Continuous Research's
#    evening-report (21:00 vs 20:00) so the day's full picture is captured.
