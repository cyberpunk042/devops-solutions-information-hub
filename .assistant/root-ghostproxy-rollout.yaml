      source_for_unwritten_tasks: "raw/notes/2026-05-08-pain-points-inventory-from-root-failed-conversation-master-aggregate.md (180 pain-points × 15 audit clusters — when an E00x epic has no task addressing a pain-point, AUTHOR the task FIRST then execute it; this is the PREFERRED fallback before cross-cycle pick)"

    default_lower_priority_sister_integration:
      # NOT hard-forbidden — operator-corrected from v5-evening overcorrection.
      # These are the sister-integration SFIF cycle artifacts. Worker DEFAULTS AWAY from them
      # but they are not absolutely blocked; fallback path exists with justification chain.
      epics: [sfif-rollout-and-second-brain-integration]
      modules: [M001, M002, M003, M004, M005, M006, M007, M008, M009, M010, M011, M012, M013, M014]
      module_pattern: "wiki/backlog/modules/root-ghostproxy-m0##-*.md (the NUMBERED modules, NOT the m-e0##-* per-feature sub-modules)"
      task_id_range: "T001-T067 — sister-integration setup tasks (install root-ghostproxy AS A SISTER-PROJECT)"
      rationale: "Per operator: root-ghostproxy's INSTALL is DONE OR DOES NOT MATTER. Worker fixes features by default. A setup task is only picked when the in_scope_default substrate (including pain-points-authoring) is genuinely exhausted AND the setup task is prerequisite to an E001-E007 task."

    pick_filter:
      # PRIORITY ordering applied at step 2_pick_next_task; NOT a hard cross-task filter.
      # Per operator-correction 2026-05-16: SFIF is workflow not priority; cross-task block
      # is the overcorrected anti-pattern. Default to in_scope_default; cross-cycle pick
      # allowed as fallback with full justification chain.

      priority_order:  # First match wins
        - "1. OPERATOR-EXPLICIT PRIORITY-OVERRIDE in .assistant/_state/root-ghostproxy-rollout-operator-directives.md (operator-stated task ID or topic; can override anything)"
        - "2. DEFAULT — task whose parent_epic ∈ in_scope_default.epics (E001-E007), highest audit-cluster severity first (C14 catastrophic > C04 input-discipline > ... per pain-points-inventory severity-map), then P0→P1→P2→P3 within severity class"
        - "3. AUTHOR FROM PAIN-POINTS — if no ready in_scope_default task: author a new task from the highest-severity unfixed pain-point in audit_substrate.pain_points_inventory, map to appropriate E00x epic, place under wiki/backlog/modules/root-ghostproxy-m-e0##-* (create sub-module if needed); then execute it per SDD+TDD"
        - "4. CROSS-CYCLE FALLBACK (rare; with justification chain) — if 1+2+3 yield nothing AND a default_lower_priority_sister_integration task is genuinely prerequisite to an in_scope_default task that ISN'T currently ready (i.e., the setup work would unblock the feature work), pick the prerequisite setup task; stage audit-cluster + prerequisite-feature justification in Resolution; SURFACE to wiki/backlog/operator-decision-queue.md as soft-signal Q## with cascade:root-ghostproxy + decision_needed:cross-cycle-justification"
        - "5. Within-scope tiebreaker — smallest-scope ready task wins (Goldilocks per-tick); skip operator-in-progress tasks (status:in-progress) to avoid step-on-toes"

      within_feature_sub_cycle_priority:
        # When picking among multiple ready sub-tasks WITHIN an E00x feature's sub-modules
        # (root-ghostproxy-m-e0##-#-*), apply the recursive SFIF soft-priority ordering at
        # THAT scope. Per operator 2026-05-16: "SFIF also mean that you priritize Skffold
        # before fundation before infrastructure before future... obviously... this does
        # not mean it completley block tasks either..."
        prefer_order: "Scaffold sub-tasks → Foundation sub-tasks → Infrastructure sub-tasks → Features-implementation sub-tasks (soft within-feature ordering)"
        not_a_hard_block: "If a Features-implementation sub-task is the only one ready and prior tiers are blocked or genuinely done, picking the Features-impl sub-task is fine"

      anti_pattern_violations_refused:
        - "Treating cross-cycle pick as ABSOLUTELY forbidden — operator-corrected: 'this does not mean it completley block tasks either'"
        - "Treating SFIF as a CROSS-TASK pick priority across SCOPES — SFIF is per-scope recursive workflow, not cross-scope priority"
        - "Picking from default_lower_priority_sister_integration when in_scope_default has ready tasks (work-avoidance)"
        - "Freezing when in_scope_default is sparse — instead: author from pain-points-inventory + build forward"
        - "Skipping the surface-to-operator-decision-queue step when taking the cross-cycle fallback (justification chain is the gate)"

      operator_explicit_override: "Operator-explicit PRIORITY-OVERRIDE in operator-directives.md ALWAYS wins above all 5 priority levels — operator can pick any task regardless of cycle membership"

    per_task_workflow:
      # Each picked task (always an E001-E007 task) executes through SDD+TDD with SFIF at task scope
      stage_exit_criteria:
        document:
          gate: "Spec exists per spec-driven profile (constitution-md or requirements-spec or delta-spec); [NEEDS CLARIFICATION] markers resolved or surfaced; checklist-as-unit-tests; readiness 0-25%"
          forbidden: [code-file, test-file]
        design:
          gate: "Plan derived from spec (plan-generated-from-spec, NOT free-form); per-item trace to spec section; readiness 25-50%"
          forbidden: [code-file, test-file]
        scaffold:
          gate: "Type-definitions / signatures / stubs compile; REAL failing tests authored (TDD Red — assertion failure verified, NOT placeholder); no business logic; readiness 50-80%"
