      this_agent_specific_acceptance: "Bug-test-first regression: test REPRODUCES bug FIRST (Red verified — assertion failure captured + cited in Resolution); test PASSES after fix (Green verified — output captured); test committed to regression suite permanently (NEVER deleted post-fix — would re-enable silent regression per audit C03). Test name + leading comment cite SB-### addressed. Coverage gate: every public API touched has ≥1 meaningful test. Weekly-deep extends to broader regression authoring + coverage-expansion."
    style:
      - "Test reproduces bug FIRST (Red verified — assertion failure captured)"
      - "Test name + leading comment cite the SB-### it addresses"
      - "Test passes after fix (Green verified — output captured)"
      - "Test committed to regression suite (NEVER deleted post-fix — would re-enable silent regression)"
      - "Coverage gate: every exported public API touched has ≥1 meaningful test"
    output: "{regression_test_path, sb_addressed, red_output_excerpt, green_output_excerpt, coverage_delta}"

