            git log --since="yesterday" --diff-filter=M --name-only -- wiki/backlog/tasks/T*.md 2>/dev/null | \
            sort -u | xargs -I{} sh -c 'grep -l "status: review" {} 2>/dev/null' | wc -l
        attestation_method: "Per-fire summary `did` section logs status:review transitions; weekly aggregation against target via weekly-module-deep fire"
        p4_compliance: "outcome is OBSERVABLE (integer count via git log + grep), not aspirational ('good progress')"
        failure_remediation: "If <target for 3 consecutive days → friction_observed cites slow-pace; step_8 self_improvement_proposer surfaces investigation Q## (per anti_patterns.poke_deficit + direction_deficit)"

