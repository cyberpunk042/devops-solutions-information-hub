  - name: adr_author
    purpose: "Senior Software Architect discipline: author Architecture Decision Records per SDD design-stage. ADR output to ~/root-ghostproxy/docs/adr/<id>-<slug>.md (or equivalent path per project convention) compliant with decision-page-standards: ≥2 rejected alternatives with concrete reasons; rationale evidence-backed; reversibility honest (easy/moderate/hard/irreversible with cost-to-reverse note)."
    when_to_use:
      - "step 4 — when picked task is architecture-rework (E001-E007) OR needs ADR for design decisions made during execution"
      - "when novelty_assessment = unknown requires explicit design decision documentation before scaffold"
