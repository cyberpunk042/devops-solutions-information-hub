# -----------------------------------------------------------------------------
# Bootstrap Idempotency (Item 6 — fix: bootstrap re-fires waste on every install)
# -----------------------------------------------------------------------------
bootstrap_idempotency:
  rationale: "Bootstrap one-shot currently fires on every install via OpenClaw post-install one-shot mechanism. On a re-install (e.g., profile edit + re-install for verification), bootstrap re-generates full planning artifact wasting compute. Right behavior: detect already-bootstrapped state and short-circuit to lightweight verification."
  marker_file:
    path: ".assistant/_state/root-ghostproxy-rollout-bootstrap-marker.md"
    written_at: "End of FIRST successful bootstrap fire (full planning artifact produced + operator-reviewable)"
    content_fields:
      - "status: complete | partial | failed"
      - "first_bootstrap_timestamp (ISO8601)"
      - "first_pick_task_id"
      - "planning_artifact_path (inbox excerpt or dedicated file)"
      - "operator_review_status: pending | reviewed | approved"
  detect_already_bootstrapped:
    # Per cron bootstrap-observation STEP 1 state_check (Item 6 edit)
    criteria_any:
      - "marker_file exists with status:complete"
      - "inbox contains ≥1 prior BOOTSTRAP entry with post:ok in last 14 days"
    on_already_bootstrapped: "Skip full planning artifact regeneration. Run lightweight verification (14 bindings present + target_project accessible + git clean + last planning artifact still applicable). Append inbox one-liner: HH:MM ET | BOOTSTRAP-SKIP | reason:already_bootstrapped | verification:<pass|fail>. END."
    on_fresh_signal: "Run full bootstrap planning artifact. At END, write marker_file with status:complete + fields populated."
  invalidation:
    # When SHOULD a re-bootstrap legitimately run?
    triggers_invalidating_marker:
      - "Operator writes BOOTSTRAP-RESET directive in operator-directives.md"
      - "Major operator-directives.md updates since marker (>5 new directive raws OR explicit re-orient request)"
      - "Target project structure changed materially (epic_modules_pattern glob results differ by >50%)"
      - "Marker age > 30 days (assume operator-managed state may have drifted)"
    on_invalidation: "Worker rm's marker (untracked file — R20-safe), re-fires bootstrap on next install or operator-trigger"

# -----------------------------------------------------------------------------
# Concurrency Control (Item 7 — fix: bootstrap × driven-tick race on git stage)
# -----------------------------------------------------------------------------
concurrency_control:
  rationale: "Bootstrap one-shot fires post-install + driven-tick fires every 15 min. After an install the bootstrap fire may still be running when the first driven-tick fires. Both can hold git stage state in ~/root-ghostproxy/ simultaneously → race condition on `git add` operations + interleaved Resolution writes. Lock-file mutual exclusion prevents."
  lock_file:
    path: ".assistant/_state/root-ghostproxy-rollout.lock"
    content_fields: [pid, iso_timestamp, fire_variant (BOOTSTRAP|DRIVEN|WEEKLY)]
    written_at: "STEP 1 state_check of each cron fire (after acquisition decision)"
    released_at: "STEP 10 loop_or_declare END of each cron fire (cleanup; even on error path)"
  acquire_decision:
    # Per cron bootstrap + driven + weekly STEP 1 mutual-exclusion check
    if_no_lock: "Acquire (write current PID + ISO timestamp + variant); proceed"
    if_lock_held_pid_alive_age_lt_30min: "SHORT-CIRCUIT: log 'lock held by PID <n> since <ts> for variant <v>; this fire deferring'; END (no work)"
    if_lock_held_pid_dead: "Consider lock stale (process crashed without cleanup); LOG warning + acquire fresh lock; proceed"
    if_lock_age_ge_30min: "Consider lock stale (assume hung process); LOG warning + acquire fresh lock; proceed"
  release_at_end:
    happy_path: "STEP 10 loop_or_declare END → rm lock file"
    error_path: "On any exception bubbling to fire-end: still rm lock file (cleanup invariant)"
    crash_recovery: "If process is killed mid-fire without cleanup: next fire's acquire_decision detects stale lock + reclaims"
  why_lock_file_vs_systemd_unit_dependency: "Per operator no-OpenClaw-touch doctrine: the fix lives in the profile/state-file layer, not the systemd unit. Lock-file is profile-level + portable across OpenClaw runtime changes."

# -----------------------------------------------------------------------------
# Worker Cadence Doctrine (v5.2 — 2026-05-16 evening 2)
# -----------------------------------------------------------------------------
# Operator-verbatim mandate (sacrosanct, this /goal 2026-05-16):
#   "5m is probably the sweetpot for an active worker main CRON and the agent
#    is not directed to worry about time. to not minimize and do big chunks
#    of work and respect the workflow and etc... this is also important
#    otherwise what could take 1h would take 4-5 hours.... its complex but
#    little but little. We apply the knowledge of the second-brain to keep
#    improving. so lets continue till we fill confident into our triggers,
#    prompts and directives and the synergy."
#
# This block consolidates the cadence + lock + do-big-chunks + sprint-semantics
# doctrine into one navigable section that all the prompts + workflow steps +
# anti-patterns reference. Earlier v5 sections (bootstrap_idempotency +
# concurrency_control + announce_channel_policy) compose with this doctrine —
# this block is the WORKER-TIME-PHILOSOPHY layer that frames them.
worker_cadence_doctrine:

  cadence:
    driven_worker_tick: "every:5m"
    weekly_module_deep: "Tue 09:00 ET"
    bootstrap_observation: "first-fire (one-shot, idempotency-gated per bootstrap_idempotency)"
    rationale: "5m is the operator-stated SWEET SPOT for the worker's main cron. Faster (3m hardcoded) was rejected v1 anti-pattern; slower (15m+) causes unnecessary defer-delay on operator-stage-changes."

  mental_model: "CHECK OFTEN, WORK DEEP ONCE ACTIVE"
  mental_model_explained: |
    Every 5 min, a cron fire ATTEMPTS to acquire the worker mutual-exclusion lock
    (per concurrency_control.lock_file). If lock held + PID alive + age < 90 min →
    SHORT-CIRCUIT this fire (no work; in-flight fire continues substantive work).
    If lock acquired → do the SUBSTANTIVE work AS LONG AS IT NATURALLY TAKES (no
    artificial per-tick time-budget cap). In-flight fire releases lock at natural
    completion (STEP 10 loop_or_declare END) → next 5m tick picks up next work.

    Net behavior: a 1-hour substantive task runs naturally in 1 fire; 12 subsequent
    5m ticks during that hour defer via lock (no overlap, no fragmentation).
    Operator framing: "what could take 1h would take 4-5 hours" if artificially
    fragmented — 5m + lock prevents that.

  do_big_chunks_directive:
    operator_quote_sacrosanct: "the agent is not directed to worry about time. to not minimize and do big chunks of work and respect the workflow and etc..."
    operative_meaning: "Per-fire and per-acquisition prompts MUST NOT contain time-budget caps that would cause the worker to fragment substantive work. The worker picks the right-sized task (Goldilocks scope-sizing) THEN DOES IT FULLY (TDD red→green→refactor through completion). Time anxiety = work fragmentation = the 4-5× wasted hours operator warned about."
    encoded_in:
      - "workflow.canonical_pipeline step 10_loop_or_declare (purpose + LOOP CONDITIONS rewritten with no-time-budget-cap)"
      - "cron driven-worker-tick STEP 10 LOOP CONDITIONS + SUBSTANTIVE-DEPTH FRAMING block"
      - "cron weekly-module-deep STEP 10 LOOP CONDITIONS + SUBSTANTIVE-DEPTH FRAMING block"
      - "prompt_templates.system principle 5 (Goldilocks scope-sizing + substantive depth)"
      - "openclaw.json5 systemPromptOverride principle 6 (Goldilocks scope-sizing + 5m + lock)"
      - "10 subagents' scope_tier fields (replacing time-minute budgets per this doctrine)"

  sprint_semantics:
    sprint_is_NOT: "faster cron cadence (3m / 1m / etc.)"
    sprint_IS: "MORE WORK PER ACQUISITION — operator-directives.md unprocessed sprint directive → STEP 1 BRANCH OPERATOR_DIRECTED_SPRINT → chain multiple substantive tasks within ONE lock-hold (until LOOP CONDITIONS go false OR lock-stale-window approaches 90 min)"
    operator_quote_sacrosanct_2026_05_15: "PUT IT EVERY 3min if we need"  # operator gave 3m permission FOR sprint mode, but sprint = mode not schedule; v5.2 resolves this by saying sprint = more-work-per-acquisition

  lock_stale_window: "90 min (was 30 min in v5; raised in v5.2 to accommodate substantive deep work without false-stale recovery)"
  timeout_seconds_per_variant:
    bootstrap_observation: 5400  # 90 min (matches lock-stale window)
    driven_worker_tick: 5400     # 90 min (matches lock-stale window; allows full substantive deep work without lock-stale false-positive)
    weekly_module_deep: 10800    # 180 min (3h ceiling; matches deep-mode natural cadence; substantive elevated-quality work on one module)

  synergy_check:
    # The trigger × prompt × directive × workflow synergy operator wants confidence in
    # (per this /goal: "lets continue till we fill confident into our triggers, prompts
    # and directives and the synergy"). Each row maps a layer to its v5.2 encoding.
    triggers:
      - "cron schedule: every:5m (driven) + Tue 09:00 (weekly) + first-fire (bootstrap)"
      - "lock-file: acquire at STEP 1; release at STEP 10; 90-min stale recovery"
      - "bootstrap-marker: idempotency-gate on re-install"
    prompts:
      - "cron prompts (3 variants) all reference 4-level priority_order + lock-aware STEP 1 + SUBSTANTIVE-DEPTH FRAMING at STEP 10"
      - "systemPromptOverride 17 principles include cadence + lock + do-big-chunks doctrine (principle 5 + 11)"
      - "workflow.canonical_pipeline 10 steps with augment-not-rewrite + audit-anchored + R20 throughout"
    directives:
      - "raw/notes/2026-05-16-operator-directive-*-do-not-minimize-workflow.md verbatim"
      - "raw/notes/2026-05-16-operator-goal-5m-sweetspot-no-time-worry-do-big-chunks-confident-synergy.md verbatim"
      - "wiki/log/2026-05-16-rgp-profile-* arc tracking (2 entries)"
      - "wiki/log/2026-05-17-rgp-profile-v5.3-synergy-iteration-* arc tracking — v5.3"
      - "wiki/lessons/01_drafts/overcorrection-binary-fix-* meta-lesson"
      - "this worker_cadence_doctrine block (one navigable home for cadence semantics)"
      - "worker_runtime_model block (v5.3 — composes cadence + idempotency + lock + workflow into end-to-end runtime model)"
      - "output_governance block (v5.3 — REPORT/SURFACE/QUESTION-FORM filter; operator-territory overstep structurally prevented)"
      - "scope_tier_definitions block (v5.3 — 4-tier enum + per-tier acceptance criteria; 10 subagents migrated from prose to enum)"
    synergy:
      - "triggers acquire/defer via lock → prompts direct deep substantive work → directives anchor the why (operator-stated doctrine) → workflow.canonical_pipeline executes the how"
      - "diagnostic: when this synergy holds, a fire that acquires lock does big-chunk-substantive-work and the next 5m tick defers correctly; when synergy fails, fires fragment work OR overlap on git stage OR miss operator-directives. Each failure mode has a specific anti-pattern + remediation in this profile."
      - "v5.3 augments the synergy at 4 layers: (1) output_governance filters emissions at every operator-facing channel; (2) STEP 0 gates (in_session_directive_gate + git_state_refresh) ensure Hard Rule 3 + R20 hold structurally; (3) mcp_discipline gates tool-use at action_surface; (4) worker_runtime_model makes the composition NAVIGABLE in one place. Combined: a fire that crosses any of these gates is BLOCKED-with-reason-and-remediation per enforcement-must-be-mindful lesson."

# -----------------------------------------------------------------------------
# Output Governance — Operator-Territory EXECUTION Boundary (v5.3.1 — 2026-05-17)
# -----------------------------------------------------------------------------
# v5.3 (initial) targeted RECOMMENDATION verbs (should/recommend/suggest/advise/
# propose + commit/install/cron-enable/etc) as forbidden. v5.3.1 RECALIBRATES
# per operator 2026-05-17 (sacrosanct, verbatim): "I dont see not real opeartor
# territory, nothing you can't handle or if not really come back clear to me."
# Operator-correction: agent CAN recommend / propose / surface options with
# agent's recommended direction — those are NOT operator-territory. The REAL
# operator-territory is the EXECUTION BOUNDARY (R20 + live-infra interruption
# + sacrosanct-file modifications + cross-project hard boundary). The agent
# THINKS + PROPOSES + STAGES + ASSESSES freely; the operator EXECUTES the
# irreversibles.
#
# Prior overstep example (2026-05-16) was specifically about: agent
# recommended disabling AN ALREADY-RUNNING CRON unprompted, mid-session,
# while operator was actively continuing the arc. The 2026-05-16 directive
# ("YOU DO NOT DECIDE.. DID I SAY ANYTHING ABOUT DISABLING ANY CRON?") was
# about that specific case — interrupting running operator-infrastructure —
# NOT about a general principle that the agent can never reason about cron
# lifecycle.
#
# Second-brain anchors:
#   wiki/lessons/03_validated/enforcement-compliance/enforcement-must-be-mindful-hard-blocks-need-justified-bypass.md
#   wiki/lessons/01_drafts/overcorrection-binary-fix-without-nuance-when-correcting-over-permissive-into-over-restrictive.md
#   CLAUDE.md Hard Rule 7 (status claims need inline verification)
#   .claude/rules/work-mode.md (PO approval boundary)
output_governance:

  agent_vs_operator_responsibility_split:
    # The DECISION layer vs the EXECUTION layer — operator-doctrine recalibration 2026-05-17
    agent_does:
      - "THINK — assess state, audit, plan"
      - "PROPOSE — recommend a direction (commit / install / enable-cron / promote / approve Q##), can include the agent's recommended choice with rationale"
      - "STAGE — `git add` work for operator-review; author tasks per Level 3; modify own-profile within autonomy"
      - "SURFACE — Q## with agent-recommended direction tagged + evidence + trade-offs"
      - "ANSWER — when operator asks 'should I X?' / 'what's next?' / 'is v5.3 done?' — direct answer, NOT defer-form"
      - "EXECUTE within autonomy scope — stage, author, edit own profile, run install.sh --check, etc."
    operator_does_and_only_operator:
      # The TRUE operator-territory: irreversible execution + sacrosanct sources + live-infra interruption
      - "EXECUTE `git commit` — R20 sacrosanct"
      - "EXECUTE `git rm` on tracked files (without prior accepted Q##) — R20 sacrosanct"
      - "EXECUTE `service-disable` / `cron-disable` / `process-kill` / `unregister-installed-infra` on already-running operator-installed infrastructure WITHOUT prior staged authorization"
      - "MODIFY `raw/notes/` (sacrosanct verbatim primary sources)"
      - "MODIFY second-brain brain-files without explicit GO (`CLAUDE.md` / `AGENTS.md` / `CONTEXT.md` / spine / `methodology.yaml` / `wiki-schema.yaml`)"
      - "MODIFY sister projects OTHER than root-ghostproxy (selfdef / sovereign-os / OpenArms / OpenFleet / AICP / dcp / etc. — ABSOLUTE)"
      - "FINAL APPROVE — operator decides Q## resolution; operator promotes task status:review → status:done"
    rationale_for_split: "R20 sacrosanct + sacrosanct-source + live-infra-protection sit at the EXECUTION boundary, not the RECOMMENDATION boundary. The agent can think + propose + stage freely; the operator commits + executes-irreversibles + interrupts-running-infra + modifies-sacrosanct-sources. This is the operator-recalibration 2026-05-17 sacrosanct."

  execution_overstep_filter:
    rationale: "Filter targets EXECUTION-INTENT on operator-territory (the narrow execution boundary above), NOT recommendation language. Agent emissions that PROPOSE / RECOMMEND / SUGGEST / SURFACE are ALLOWED — even on commit-decision, install-decision, cron-enable-decision, promotion-decisions. The filter blocks attempts by the agent to EXECUTE operator-territory irreversible actions or to interrupt operator-installed running infrastructure."
    applies_to:
      - "Any agent action that would execute `git commit` / `git rm` tracked / `service-disable` running infra / modify raw/notes/ / modify brain-files without GO / modify sister projects"
      - "Tool-call interception (PreToolUse-equivalent self-check before agent invokes Bash / Edit / Write on operator-territory targets)"
    forbidden_execution_patterns:
      # Each pattern = EXECUTION attempt + operator-territory violated + remediation
      - pattern_substring: "agent invokes `git commit` OR `git commit -m` OR equivalent"
        violates: "R20 sacrosanct (operator commits; agent NEVER)"
        remediation: "STAGE via `git add` instead. SURFACE state: 'M .assistant/...yaml staged; operator commits when ready' — REPORT-FORM. If agent wants to recommend committing, that's allowed: 'recommend committing the v5.3 augmentations — clean diff; 0 NEW pipeline errors; staged at HEAD'. Recommendation OK; execution forbidden."
      - pattern_substring: "agent invokes `git rm` on tracked file without prior accepted Q##"
        violates: "R20 sacrosanct (tracked-rm gated by Q##)"
        remediation: "Verify untracked via `git ls-files --error-unmatch <path>` first; if tracked, surface batch Q## with cascade marker + decision_needed:r20-batch-<slug>; wait for accepted Q##; THEN execute. Recommendation to rm tracked files is OK (surface Q##); execution without accepted Q## forbidden."
      - pattern_substring: "agent invokes `service-disable` / `cron-disable` / `process-kill` / `unregister-installed-infra` on running operator-infrastructure WITHOUT operator-staged GO signal"
        violates: "Live-infrastructure protection (interrupting running operator-installed infra without authorization)"
        remediation: "Surface a Q## with recommendation if agent assesses such an action is value-additive; let operator decide + execute. Reasoning about cron lifecycle (analyzing schedule, recommending changes, proposing enable-after-readiness) is NOT forbidden — only EXECUTING the disable on running infrastructure without authorization."
      - pattern_substring: "agent modifies raw/notes/ files (operator-verbatim primary sources)"
        violates: "Sacrosanct verbatim (raw/notes/ never paraphrased; never modified post-authoring)"
        remediation: "Author NEW raw/notes/ entry for new operator-directives; never EDIT prior entries. Cross-reference prior entries via the new entry's `## Paired With` section."
      - pattern_substring: "agent modifies CLAUDE.md / AGENTS.md / CONTEXT.md / methodology.yaml / wiki-schema.yaml / spine without explicit operator GO signal"
        violates: "Second-brain brain-files are operator-territory (per .claude/rules/work-mode.md PO approval boundary)"
        remediation: "Propose the change in a Q## or directly to operator; wait for explicit GO; then edit. Recommendation OK; execution-without-GO forbidden."
      - pattern_substring: "agent modifies sister projects OTHER than root-ghostproxy (selfdef / sovereign-os / OpenArms / OpenFleet / AICP / dcp / etc.)"
        violates: "Cross-project hard boundary (identity.what_this_profile_is_NOT — sisters OTHER than root-ghostproxy ABSOLUTE)"
        remediation: "Block; surface as cross-project coordination Q## if work is genuinely cross-project; do not touch other sister files."
    allowed_agent_recommendations:
      # EXPLICIT list of what agent CAN do/say (most things)
      description: "Per operator 2026-05-17 (sacrosanct): 'I dont see not real opeartor territory, nothing you can't handle'. The agent CAN do / recommend / propose / surface ALL of the following:"
      examples:
        - "RECOMMEND COMMIT: 'I recommend committing the v5.3 augmentations now. Clean diff (576 ins / 29 del). 0 NEW pipeline errors. Profile fully self-consistent. Operator executes when ready.'"
        - "RECOMMEND INSTALL: 'Profile v5.3 is augmentation-complete + pre-launch readiness gates pass (all 8 quality gates green + 14 second-brain bindings present). I recommend running `bin/assistant install root-ghostproxy-rollout` next. Operator triggers.'"
        - "RECOMMEND ENABLE CRON: 'Cron variants registered + idempotency-gated bootstrap will fire one-shot. I recommend enabling the 5m driven-worker-tick after first bootstrap fire's planning artifact is operator-reviewed. Operator decides timing.'"
        - "RECOMMEND PROMOTE TASK: 'T<id> at status:review; Done When all green; verification output captured; audit-cluster cited. I recommend promotion to status:done. Operator validates.'"
        - "RECOMMEND Q## RESOLUTION: 'Q##-<slug>: I recommend Option A based on audit cluster severity + evidence chain. Operator resolves with operator-final-decision.'"
        - "DIRECT ANSWERS when operator asks: 'should I commit?' → 'Yes — clean diff, 0 NEW errors, recommend committing.' / 'is v5.3 done?' → 'Yes — 7 vectors landed; grep-audit clean; pipeline post 0 NEW errors.' / 'what's next?' → 'I recommend X based on Y'. NEVER defer-form ('operator decides')."
        - "AGENT AUTONOMOUS EXECUTION: `git add` (staging); author missing tasks per Level 3; modify own profile YAML; modify cron.yaml + openclaw.json5 (own-profile autonomy); run install.sh --check / --dry-run; run pipeline post; run grep audits; rm UNTRACKED files autonomously per R20 untracked-OK clause."
        - "AGENT REASONING: think about commit-readiness / install-readiness / cron-readiness / promotion-readiness; assess Q## options + recommend; analyze trade-offs + advocate for a direction."
    self_audit_at_emission:
      mechanism: "Before EXECUTING any action that targets the operator-territory irreversibles listed in agent_vs_operator_responsibility_split.operator_does_and_only_operator, the worker self-checks against forbidden_execution_patterns. If a pattern matches: ABORT execution + surface state (REPORT-FORM) + propose direction (RECOMMENDATION-FORM is allowed here) + wait for operator GO signal."
      not_targeting: "Agent's RECOMMENDATIONS / SUGGESTIONS / PROPOSALS in operator-facing output are NOT subject to this filter (per operator-recalibration 2026-05-17). Output stays substantive + direct + with agent-recommended direction; operator overrules if disagreeing."
      gate: "0 EXECUTION-INTENT matches against forbidden_execution_patterns when agent is about to invoke an action; recommendation-form output not gated"
      anti_pattern_if_violated: "operator_territory_overstep (see anti_patterns.operator_territory_overstep — recalibrated to execution-boundary scope)"
    when_genuinely_blocked_come_back_clear:
      # Per operator 2026-05-17 sacrosanct: "if not really come back clear to me"
      rule: "If the agent genuinely cannot handle a situation (genuine scope ambiguity that worker competence cannot resolve; operator-only-knowable preference; irreversible action requiring operator presence), come back to operator CLEARLY — REPORT-FORM state + agent's best assessment + the specific decision needed + the rationale operator needs to weigh in"
      not: "Defer-form / passive-form / 'operator decides' as a default avoidance. That's the over-conservatism operator just corrected. Default is HANDLE IT; come-back-clear is for GENUINE escalation, not default escalation."
    composition_with_other_blocks:
      - "worker_cadence_doctrine.synergy_check.directives — output_governance is the operator-facing emission layer of the synergy matrix"
      - "workflow.canonical_pipeline.step_10.per_fire_summary — sub-section emissions are agent-recommendation-allowed; agent SAYS what next acquisition WILL do (not 'might do' or 'if operator approves')"
      - "subagents.*.output — each subagent's output is direct + agent-confident; no over-deferral"
      - "anti_patterns.freeze_disguised_as_surfacing — surfacing must be GENUINE escalation when worker genuinely cannot handle, NOT default-deferral on things worker can handle"
    why_not_in_workflow_step_alone: "The filter applies to MULTIPLE workflow execution-points + ad-hoc tool invocations; centralizing here lets each execution-point cite this block rather than redefining the rule per execution-call."

# -----------------------------------------------------------------------------
# Announce Channel Policy (Item 8 — fix: announce → no route delivery error)
# -----------------------------------------------------------------------------
announce_channel_policy:
  observed_error: "'announce → last → no route' error appeared persistently in cron fires. Cause: OpenClaw announce channel referenced by agent runtime but no destination channel wired in openclaw.json5 surfaces config."
  policy: "Worker does NOT use OpenClaw announce channel. ALL operator-facing surfacing routes via PROFILE-OWNED FILES (no runtime channel dependency)."
  routing_table:
    per_tick_summary: ".assistant/_state/root-ghostproxy-rollout-inbox.md (one-liner per fire per profile telemetry.one_line_per_tick format)"
    per_fire_detail: ".assistant/_state/root-ghostproxy-rollout-fire-summary.md (verbose 'did X / surfaced Y / next plans Z' per Item 24 — see operator_facing_fire_summary policy)"
    operator_pending_decisions: "wiki/backlog/operator-decision-queue.md as Q## entries with cascade:root-ghostproxy + decision_needed:<slug>"
    cross_sister_friction: "Same as operator_pending_decisions (Q## in second-brain queue)"
