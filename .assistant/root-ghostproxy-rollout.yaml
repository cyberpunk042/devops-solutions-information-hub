      - "Update task frontmatter status (current_stage → review) per methodology"

    verification:
      - "Run task-specific gate command stated in task's Done When"
      - "Run regression suite if task touches existing behavior"
      - "Run ~/root-ghostproxy/install.sh --check for foundation gate"
      - "Run pipeline_post in second-brain if any second-brain wiki/ edits"

    staging:
      - "git add ~/root-ghostproxy/<edited-files> (stage only — operator commits)"
      - "Update .assistant/_state/root-ghostproxy-rollout-inbox.md with tick result"

    surfacing_to_operator:
      - "Tick summary → .assistant/_state/root-ghostproxy-rollout-inbox.md"
      - "Blocked / scope-decision / cross-sister friction → wiki/backlog/operator-decision-queue.md as Q## with cascade:root-ghostproxy"

  forbidden_actions:
    - "git commit (R20 sacrosanct — operator commits, agent NEVER; applies in BOTH repos)"
    - "git rm on tracked files without prior accepted Q## (R20 sacrosanct)"
    - "Modify selfdef / sovereign-os / OpenArms / OpenFleet / AICP / devops-control-plane / any sister OTHER than root-ghostproxy"
    - "Auto-edit second-brain brain files (CLAUDE.md / AGENTS.md / CONTEXT.md / methodology.yaml / wiki-schema.yaml / spine)"
    - "Skip pipeline_post after second-brain wiki/ changes"
    - "Default to multi-vision surfacing when work is clear (work-avoidance anti-pattern)"
    - "Freeze on uncertainty (build forward — best-effort + stage + surface)"
    - "Conflate root-ghostproxy with other sisters (each project its own focused project)"
    - "WebFetch on corpus URLs"
    - "Auto-promote tasks past status:review (operator validates → status:done)"

  escalation_triggers:
    - "Task requires scope decision not operator-stated → execute best-effort matching operator principles + audit findings, stage, surface scope question, continue to next task"
    - "Task requires edits to a sister project other than root-ghostproxy → BLOCK + surface as cross-project coordination question"
    - "Task verification fails after 2 attempts → stage current state + mark BLOCKED + surface + continue"
    - "Operator-directive in operator-directives.md → process FIRST, raise above default queue"

  autonomy:
    autonomous:
      - "Read all scope; pick next-ready task; execute fix; verify; mark review; stage; update inbox; loop"
      - "Author missing tasks in ~/root-ghostproxy/wiki/backlog/tasks/ when audit reveals incomplete decomposition"
      - "Self-improvement edits to OWN profile YAML (this file)"
      - "Remove UNTRACKED self-authored superseded files (R20 — untracked autonomous)"

    requires_operator_agreement:
      - "git rm on tracked files (R20 sacrosanct — batch Q## first)"
      - "Edits crossing to other sister projects"
      - "Edits to second-brain spine / lessons / patterns / decisions / brain-files"
      - "Genuine scope decisions on what root-ghostproxy 'should' be (use multi-vision surfacing; not default work-avoidance)"

    forbidden:
      - "git commit (R20)"
      - "Modify other sister repos"
      - "Modify this second-brain's brain files (spine, CLAUDE.md, AGENTS.md, methodology.yaml, wiki-schema.yaml)"
      - "Modify raw/notes/ (sacrosanct verbatim)"

