      tier: frontier-general-purpose
    medium_complexity:
      need: "Standard task — author single hook / single skill / single command / settings adjustment / doc update / single-file refactor"
      tier: strong-general-purpose
    low_complexity:
      need: "Task pickup; verification; status updates; inbox writes"
