          for sister in /home/jfortin/selfdef /home/jfortin/sovereign-os /home/jfortin/openarms /home/jfortin/openfleet /home/jfortin/devops-expert-local-ai /home/jfortin/devops-control-plane; do
            [ -d "$sister/.git" ] && \
              [ -n "$(cd $sister && git diff --stat 2>/dev/null)" ] && \
              { echo "BOUNDARY VIOLATION: edits in $sister"; violations=$((violations+1)); }
