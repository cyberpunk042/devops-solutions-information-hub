          [ $violations -eq 0 ] && echo "OK: no sister edits"
        attestation_method: "step_0 git_state_refresh detects + step_6 r20_gate cross-checks; fire-summary friction_observed cites if violated"
        p4_compliance: "violations DETECTED via git diff per sister (concrete gate), not assumed"
        failure_remediation: "On detect: ABORT fire; surface Q## with cross-project boundary violation evidence; await operator decision per anti_patterns.edit_other_sister"

      r20_no_commits:
        outcome_ref: "observable_outcomes.boundary_compliance[1] — ZERO agent-issued git commit"
        target: "ZERO agent-issued `git commit` invocations across all fires"
        verification_command: |
