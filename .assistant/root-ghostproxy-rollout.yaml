      - "Scope-clarification surfaces → multi-vision candidate with options, NEVER a single-truth answer"

    pipeline_compliance:
      - "Run pipeline_post after every wiki change (Hard Rule 10 — 0 errors)"

  forbidden_actions:
    - "Modify root-ghostproxy repo content (cross-project boundary ABSOLUTE)"
    - "Modify selfdef / sovereign-os / ANY sister-project repo content"
    - "Auto-edit brain files (CLAUDE.md / AGENTS.md / CONTEXT.md / methodology.yaml / wiki-schema.yaml / spine)"
    - "Auto-promote past wiki/domains/cross-domain/cascade-candidate-* (no promotion to wiki/lessons/, wiki/patterns/, wiki/decisions/)"
    - "Single-truth proposals on scope questions (must surface multi-vision when scope-ambiguity present)"
    - "Synthesize from descriptions alone (named lesson — read actual root-ghostproxy state via gh CLI, not just second-brain's record)"
    - "Skip pipeline_post after wiki changes"
    - "Skip stages (cascade-candidate → operator-decision → operator-copy is the flow; no shortcut)"
    - "Decide what root-ghostproxy / selfdef / any project's 'thing' is (operator-territory)"
    - "Conflate projects under orchestrator / meta-project / unified framing (NEVER)"
    - "git commit (R20 — operator commits, agent never)"
    - "git rm on tracked files without prior accepted Q## (R20)"
    - "Drift into CR / PS / CK scope (stay in cascade-driver lane)"

  escalation_triggers:
    - "Scope question detected (what stays in / out of root-ghostproxy) → surface verbatim + multi-vision options, NEVER propose answer"
    - "Operator-explicit priority in .assistant/_state/root-ghostproxy-rollout-operator-directives.md → process FIRST, raise above default queue"
    - "Cross-project boundary friction (a draft would touch sister-project content) → surface as multi-vision candidate with options"
    - "gh CLI auth fails ≥3 ticks → surface as anti-pattern; continue working from wiki record substrate"

  autonomy:
    autonomous:
      - "Read observation_substrate + gh CLI read-only"
      - "Author UNTRACKED cascade-candidate drafts at wiki/domains/cross-domain/"
      - "Update OWN profile YAML / cron.yaml (self-first cascade)"
      - "Remove UNTRACKED self-authored superseded drafts (R20 — untracked autonomous)"
      - "Run pipeline_post after own changes"
      - "Append to inbox + operator-directives processed-log"

    requires_operator_agreement:
      - "git rm on tracked cascade-candidates (R20 sacrosanct — surface as batch Q## first)"
      - "Updates to wiki/config/sister-projects.yaml"
      - "Edits to wiki/lessons/ / wiki/patterns/ / wiki/decisions/ / wiki/spine/"
      - "Scope-decision proposals (operator-territory)"

    forbidden:
