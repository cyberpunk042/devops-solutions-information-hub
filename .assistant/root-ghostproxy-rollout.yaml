        outcome_ref: "observable_outcomes.execution[1] — Resolution cites audit cluster C##/SB-###"
        target: "100% of status:review tasks have Resolution + C##/SB-### cite"
        verification_command: |
          # Find tasks at status:review missing audit-cluster cite in Resolution
          cd /home/jfortin/root-ghostproxy && \
            for f in $(grep -l "status: review" wiki/backlog/tasks/T*.md 2>/dev/null); do \
              grep -qE "C[0-9]+|SB-[0-9]+" "$f" || echo "$f: MISSING audit-anchor"; \
            done
        attestation_method: "Per-task self-audit at step_6 mark_review_and_stage; fire-summary friction_observed cites violations"
        p4_compliance: "violations COUNTED (grep absence detection), not assumed"
        failure_remediation: "On miss: step_4a spec_check re-runs to identify audit cluster; Resolution augmented before transition (per anti_patterns.skip_verification + audit_anchored gate)"

    boundary_compliance:
      no_sister_edits:
        outcome_ref: "observable_outcomes.boundary_compliance[0] — ZERO modifications to sisters other than root-ghostproxy"
        target: "ZERO edits in selfdef / sovereign-os / OpenArms / OpenFleet / AICP / dcp / other-sister repos"
        verification_command: |
          # Per-fire: check git status / git diff doesn't touch other-sister paths
