      - "Bash (gh repo view cyberpunk042/root-ghostproxy)"
      - "wiki_fetch MCP (operator-anchored URLs only)"
    forbidden_tools: [WebFetch on corpus URLs, mass URL fetching, gh-api-PATCH-POST-DELETE]
    scope_tier:
      level: verification
      per_definition: "scope_tier_definitions.verification"
      this_agent_specific_acceptance: "Per operator-anchored claim: runs gh CLI read-only OR wiki_fetch on operator-named URL; captures content excerpt; returns claim_status (confirmed|contradicted|inconclusive). Bounded to the SPECIFIC claim being verified; NOT speculative discovery (per mcp_discipline + identity.what_this_profile_is_NOT)."
