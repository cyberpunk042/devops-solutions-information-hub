    - "Multi-vision surfacing when task is clear (work-avoidance)"
    - "Tasks marked review without verification evidence"
    - "Commit attempts (R20 violation)"
    - "Tracked rm without Q## (R20 violation)"
    - "Empty ticks despite ready tasks (freeze)"
    - "Profile-YAML edits re-adding ABSOLUTE boundary on root-ghostproxy (v3 regression)"

# -----------------------------------------------------------------------------
# Subagent Scope Tier Definitions (v5.3 — enum + per-tier acceptance criteria)
# -----------------------------------------------------------------------------
# Operator-doctrinal 2026-05-16 (sacrosanct, this /goal): "the agent is not
# directed to worry about time. to not minimize and do big chunks of work".
# scope_tier characterizes WORK SHAPE (verification | substantive | bounded |
# light), NOT time-budget. Each tier has explicit ACCEPTANCE CRITERIA that
# function as the stopping condition (P4 — declarations aspirational until
# verified; the criteria are what verify the tier's work IS done).
#
# Subagent.scope_tier.level references one of the 4 tiers below; the agent
# does its work AS LONG AS IT NATURALLY TAKES until that tier's acceptance
# criteria are met. The parent fire's mutual-exclusion lock + 5m cron cadence
# handle overlap (per worker_cadence_doctrine + worker_runtime_model).
scope_tier_definitions:

  verification:
    description: "Mechanical state-check + ranking + capture; short by nature; no deep analysis"
    typical_actions:
      - "Read frontmatter + scan"
      - "Run a gate command + capture output"
      - "Lookup in a static config file"
      - "Single git ls-files / git status check"
    acceptance_criteria:
      - "Output contains the requested verification result (boolean + supporting data)"
      - "No speculative analysis beyond the verification need"
      - "Citations to source-of-truth files (which file checked, line number)"
    natural_duration_signal: "Single-pass through the verification task; work IS done when the verification gate returns its result"
    examples_in_this_profile: [task_picker, verifier, r20_gate, self_improvement_proposer-when-no-signal]

  substantive:
    description: "Deep work requiring multiple stages of progress (TDD red→green→refactor; ADR with ≥2 alternatives + rationale; bug-test-first regression with Red+Green captured)"
    typical_actions:
      - "TDD cycle: test list → Red verified → Green per test → single-step refactor"
      - "ADR authoring: ≥2 rejected alternatives + evidence-backed rationale + reversibility"
      - "Bug-test-first regression: test reproduces bug (Red) → fix → test passes (Green) → committed to suite permanently"
      - "Multi-file refactor preserving green throughout"
    acceptance_criteria:
      - "Done When checklist 100% covered by test assertions (per spec-driven.yaml checklist-as-unit-tests)"
      - "All planned tests captured Red (assertion failure verified) before any implementation"
      - "All tests Green after minimum implementation (one at a time per test-driven.yaml red_before_green)"
      - "Refactor steps preserve green (single_step_refactor — run tests after each change)"
      - "Integration-wiring exists per OpenArms Bug 6 (≥1 existing file imports new code)"
      - "Resolution section cites audit cluster (C##/SB-###) + verification output"
      - "Per-type page-standards quality bar met (e.g., decision: ≥2 rejected alternatives with reasons; lesson: ≥3 evidence items with bold source labels)"
    natural_duration_signal: "Work IS done when Done When 100% verified AND integration-wiring exists AND Resolution captures full SDD+TDD evidence chain. No time-cap per operator 2026-05-16."
    examples_in_this_profile: [task_executor, adr_author, regression_test_author]

  bounded:
    description: "Research / clarification-resolution / queue-management with a CLEAR STOPPING CONDITION but not pure single-pass verification"
    typical_actions:
      - "wiki_search + wiki_read_page across multiple related pages until clarification resolves"
      - "Done When constitutive-ness audit + augmentation if incomplete (per accept_garbage_input anti-pattern)"
      - "Operator-decision-queue surfacings (Q## authoring with cascade markers per output_governance.surface_form)"
      - "Module readiness aggregation across child tasks"
    acceptance_criteria:
      - "Stopping condition explicitly met: [NEEDS CLARIFICATION] resolved with cited source OR Done When all items verifiable OR module readiness computed"
      - "Resolution captures what was found + what was authored + what's still pending"
      - "No speculative deep-dive beyond the resolution need (anti-pollution per R13)"
    natural_duration_signal: "Work IS done when the stopping condition is met; weekly-deep fires get deeper bounded research naturally"
    examples_in_this_profile: [research_local, research_online, pm_scrum_facilitator]

  light:
    description: "Quick characterization / no-signal-skip / passive emission; minimal work"
    typical_actions:
      - "Inspect own state + propose IF signal exists; else 'no signal' log + skip"
      - "Single-line inbox entry"
      - "Pass-through (no real work this acquisition)"
    acceptance_criteria:
      - "Lightweight check completed + 'skipped' OR 'surfaced' outcome logged"
    natural_duration_signal: "Single-pass; minimal output"
    examples_in_this_profile: [self_improvement_proposer-typical-fire-no-friction]

  cross_tier_invariants:
    # Apply to ALL tiers — non-negotiable
    - "Per worker_cadence_doctrine.do_big_chunks_directive: NO per-tick time-budget cap; the tier's acceptance_criteria ARE the stopping condition, not the clock"
    - "Per CLAUDE.md Hard Rule 4 + raw/notes/ sacrosanct: operator-words quoted VERBATIM in any output (Resolution / Q## / inbox); never paraphrase"
    - "Per output_governance.execution_overstep_filter: subagent output passes the filter BEFORE emission to operator-facing channels (forbidden_patterns regenerated as report_form / surface_form / question_form)"
    - "Per R20 sacrosanct: subagent NEVER calls git commit; r20_gate gates tracked-rm via accepted Q##"
    - "Per mcp_discipline.three_predicates: subagent's tools field MUST reference only tools satisfying (referenced + routed + actually-called); phantom-tool requests surface Q##"
    - "Per anti_patterns.wholesale_rewrite_instead_of_augment: subagent uses Edit tool (surgical old_string/new_string); Write only for brand-new files"

  upgrade_path:
    notes: "If a subagent's work consistently exceeds its declared tier's acceptance criteria (signal: friction_observed cites 'tier acceptance unmet' or 'work shape mismatch'), self_improvement_proposer at step 8 surfaces a tier-upgrade Q## (e.g., 'verification → bounded' OR 'bounded → substantive')."
    bypass: "Operator-directive in operator-directives.md can override tier for a specific fire (e.g., 'research_local: substantive mode for this Q-mapping-3 deep-dive')"

# -----------------------------------------------------------------------------
# Sub-agents (lean — only what the worker pipeline needs)
# -----------------------------------------------------------------------------
subagents:

  # NOTE on subagent scope_tier (v5.3 — per scope_tier_definitions block above):
  # scope_tier characterizes WORK SHAPE (4-tier enum: verification | substantive
  # | bounded | light), NOT time-budget. Each subagent declares `level` +
  # `this_agent_specific_acceptance`; work continues until acceptance criteria
  # are met (parent fire's lock + 5m cron handle overlap). Operator-doctrine
  # 2026-05-16 sacrosanct: "the agent is not directed to worry about time".

  - name: task_picker
    purpose: "step 2 — read ~/root-ghostproxy/wiki/backlog/tasks/_index.md + frontmatter scan; rank ready tasks by priority + scope; return next-pick + rationale"
    when_to_use: ["step 2 — every acquisition"]
    tools: [Bash (ls + grep frontmatter), Read]
    scope_tier:
      level: verification
      per_definition: "scope_tier_definitions.verification"
      this_agent_specific_acceptance: "Returns picked_task_path + priority_level (1-4 per sfif_binding.pick_filter) + parent_module + parent_epic + audit_cluster cite + rationale. No speculative deep-dive beyond the rank decision."
    output: "{picked_task_path, priority, parent_module, parent_epic, audit_cluster, rationale}"

  - name: task_executor
    purpose: "step 4 — apply fix per task's Done When; edit files inside ~/root-ghostproxy/"
    when_to_use: ["step 4 — primary worker"]
    inputs: [task_path, module_path, epic_path, audit_cluster_findings]
    tools: [Read, Edit, Write, Bash (for tests/install.sh inside ~/root-ghostproxy/)]
    scope_tier:
      level: substantive
      per_definition: "scope_tier_definitions.substantive"
      this_agent_specific_acceptance: "Done When 100% covered by test assertions; all planned tests captured Red before any implementation; all tests Green after minimum implementation (one at a time); refactor steps preserve green (single_step_refactor); integration-wiring exists per OpenArms Bug 6 (≥1 existing file imports new code); Resolution cites audit cluster (C##/SB-###) + verification output; per-type page-standards quality bar met on any wiki pages authored."
    style: ["Edit in place", "No scope inventions", "Reference audit cluster in Resolution"]
    output: "{files_edited[], verification_command, anti_pattern_detected: bool}"

  - name: verifier
    purpose: "step 5 — run task-specific verification gate; capture output"
    when_to_use: ["step 5 — after every executor run"]
