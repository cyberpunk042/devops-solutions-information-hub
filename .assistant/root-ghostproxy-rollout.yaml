    note: "No OpenClaw-runtime edit needed (operator no-touch doctrine). The agent simply does not invoke announce; OpenClaw runtime's 'no route' warning becomes innocuous (agent doesn't generate the events that would need routing)."
    fallback_if_announce_still_emits: "If OpenClaw runtime still auto-emits announce events for system-level things (e.g., fire-start / fire-end markers) the 'no route' is harmless tracing; ignore. Document as known-cosmetic in handoff."

# -----------------------------------------------------------------------------
# Worker Runtime Model (v5.3 — composes idempotency + lock + cadence + workflow end-to-end)
# -----------------------------------------------------------------------------
# Operator-doctrinal 2026-05-16 (this /goal, sacrosanct): "lets continue till we
# fill confident into our triggers, prompts and directives and the synergy". The
# 6 policy blocks above (bootstrap_idempotency + concurrency_control +
# worker_cadence_doctrine + output_governance + announce_channel_policy +
# pre_launch_readiness-runtime) each describe a SLICE of behavior. This block
# STITCHES them into ONE navigable end-to-end runtime model — answers the
# question "what happens when a fire runs, in what order, governed by what?".
# Second-brain anchor: P2 Structured Context (composition layer); sub-model-
# knowledge-architecture (navigation hub pattern).
worker_runtime_model:

  one_fire_end_to_end:
    # Full lifecycle of one cron fire from trigger to completion (10 phases)

    - phase: trigger
      what: "OpenClaw cron scheduler fires the registered cron job (bootstrap-observation | driven-worker-tick | weekly-module-deep)"
      governed_by: "cron.yaml schedule + worker_cadence_doctrine.cadence + pre_launch_readiness.runtime_settings_verification (model + thinking + cache_retention + heartbeat)"
      timeout_ceiling: "per worker_cadence_doctrine.timeout_seconds_per_variant — 5400s (bootstrap, driven) or 10800s (weekly)"
      output: "Agent process spawned with prompt; timeout ceiling applied; cron-fire start-marker available for git_state_refresh comparison"

    - phase: idempotency_check
      what: "Bootstrap variant only: check marker_file + inbox-evidence; on already-bootstrapped → short-circuit lightweight verification; on fresh → full bootstrap"
      governed_by: "bootstrap_idempotency.detect_already_bootstrapped + invalidation"
      applies_to_variants: ["bootstrap-observation"]
      not_applies_to_variants: ["driven-worker-tick", "weekly-module-deep"]
      output: "Decision: full-bootstrap | lightweight-verification | SKIP"

    - phase: lock_acquisition
      what: "STEP 1 prefix: try to acquire .assistant/_state/root-ghostproxy-rollout.lock. If held + PID alive + age <90min → DEFER this fire (END no work). If acquired → proceed."
      governed_by: "concurrency_control.acquire_decision + worker_cadence_doctrine.lock_stale_window"
      stale_recovery: "PID dead OR age ≥90min → reclaim stale lock; log warning + proceed"
      output: "Lock acquired (write PID + ISO timestamp + variant) | DEFER (END)"

    - phase: directive_processing
      what: "STEP 0: read operator-directives.md + recent raw/notes/. Run git_state_refresh THEN in_session_directive_gate THEN process unmarked directives with `[!processed]` / `[!info]` markers"
      governed_by: "workflow.canonical_pipeline.step_0_operator_directives + step_0.git_state_refresh + step_0.in_session_directive_gate"
      hard_rules: "AGENTS.md Hard Rule 3 (verbatim log BEFORE acting); CLAUDE.md Hard Rule 4 (operator words sacrosanct)"
      output: "Directives processed; markers appended; gates passed; git state fresh (mid-session commits visible)"

    - phase: state_check
      what: "STEP 1: select branch (OPERATOR_DIRECTED_SPRINT | FRESH_SIGNAL | STEADY_WORK | BLOCKED | RETIRED)"
      governed_by: "workflow.canonical_pipeline.step_1_state_check.branches"
      depends_on: "git_state_refresh output (mid-session commit detection feeds STEADY_WORK vs FRESH_SIGNAL decision)"
      output: "Branch selected"

    - phase: task_pick
      what: "STEP 2: 4-level priority_order (operator-override | in_scope_default | author-from-pain-points | cross-cycle-fallback); within-feature SFIF sub-cycle soft-priority"
      governed_by: "workflow.canonical_pipeline.step_2_pick_next_task + sfif_binding.pick_filter.priority_order + within_feature_sub_cycle_priority"
      novelty_check: "Per methodology_binding.novelty_dimension_right_sizing — select model (integration vs bug-fix vs feature-development) per task_type × novelty"
      output: "Task identified + level (1-4) + parent E00x + audit-cluster cite + methodology-model selected"

    - phase: context_load_and_execute
      what: "STEP 3 (load_context) + STEP 4 (SDD+TDD sub-steps 4a_spec_check / 4b_test_list / 4c_red / 4d_green / 4e_refactor_in_green / 4f_verify_integration_wiring). SUBSTANTIVE DEPTH per acquisition — NO per-fire time-budget cap. May spawn subagents (task_executor + verifier + research_local + adr_author + regression_test_author + pm_scrum_facilitator) per subagent scope_tier acceptance criteria."
      governed_by: "workflow.canonical_pipeline.step_3 + step_4 + methodology_binding (combined_dev_disciplines SDD+TDD + sfif_binding per_task_workflow + novelty_dimension_right_sizing) + worker_cadence_doctrine.do_big_chunks_directive + scope_tier_definitions (when v5.3+) + mcp_discipline (when MCP-tool invoked)"
      output: "Task executed per task_type × novelty model; verification output captured; audit-cluster cite in Resolution"

    - phase: verify_stage_review
      what: "STEP 5 (verify) + STEP 6 (mark task status:review + git add stage) + STEP 7 (R20 gate). NEVER git commit; NEVER tracked-rm without accepted Q##."
      governed_by: "workflow.canonical_pipeline.step_5_verify + step_6_mark_review_and_stage + step_7_r20_gate + R20 sacrosanct"
      r20_check: "subagents.r20_gate uses FRESH ls-files output per git_state_refresh.cache_invariant"
      output: "Task status → review (NOT done — operator validates); edits staged; R20 held"

    - phase: self_improvement
      what: "STEP 8: inspect this fire's friction_observed; propose own-profile self-improvement IF signal exists"
      governed_by: "workflow.canonical_pipeline.step_8_self_improvement_check + subagents.self_improvement_proposer"
      signal_sources: "friction_observed entries from step_10.per_fire_summary; gate-block events from in_session_directive_gate; phantom-tool requests from mcp_discipline; overstep catches from output_governance"
      output: "Profile augmentation proposal OR 'no signal' log"

    - phase: pipeline_post
      what: "STEP 9: if second-brain wiki/ touched this fire, run `.venv/bin/python -m tools.pipeline post`; 0 NEW validation errors required"
      governed_by: "workflow.canonical_pipeline.step_9_pipeline_post_if_second_brain_edited + anti_patterns.skip_pipeline_post"
      conditional_on: "Second-brain wiki/ files touched this fire (most fires touch only ~/root-ghostproxy/ + .assistant/_state/, NOT this second-brain's wiki/)"
      output: "Pipeline post result captured (PASS | new-errors-N) in fire-summary"

    - phase: loop_or_declare
      what: "STEP 10: if next-ready task exists AND last task succeeded AND no operator-stop signal AND lock-stale-window not approaching → LOOP to task_pick. Else: write inbox one-liner + per_fire_summary (4 sub-sections passing output_governance filter) + release lock + END. NO per-fire time-budget cap."
      governed_by: "workflow.canonical_pipeline.step_10_loop_or_declare + worker_cadence_doctrine.do_big_chunks_directive + output_governance.execution_overstep_filter (per_fire_summary emission) + density_targets (when v5.3+)"
      lock_release: "rm .assistant/_state/root-ghostproxy-rollout.lock per concurrency_control.release_at_end.happy_path"
      output: "Inbox + summary written; lock released; fire ENDED"

  per_cron_variant_runtime:
    bootstrap_observation:
      schedule: "first-fire one-shot (idempotency-gated per bootstrap_idempotency)"
      typical_phases: "trigger → idempotency_check → lock_acquisition → directive_processing → state_check → task_pick (first-pick identification) → planning_artifact_write → marker_write → loop_or_declare (END after one observation)"
      no_execute: "Does NOT run phase context_load_and_execute steps 4-7 (no task EXECUTION — observation/planning only)"
      operator_role: "Operator reviews planning artifact + marker before authorizing first real driven-tick fire"

    driven_worker_tick:
      schedule: "every 5m (per worker_cadence_doctrine.cadence)"
      typical_phases: "All 10 phases when work available; 'lock held → DEFER' when prior fire still running"
      do_big_chunks: "When lock acquired, phases task_pick → loop_or_declare may take 60-90 min (substantive depth); 12 subsequent 5m ticks DEFER correctly via lock"
      sprint_mode: "OPERATOR-INVOKED (operator-directives.md unprocessed sprint directive at STEP 1 BRANCH OPERATOR_DIRECTED_SPRINT) → chain multiple substantive tasks within one lock-hold; NOT faster cadence"

    weekly_module_deep:
      schedule: "Tue 09:00 ET"
      typical_phases: "All 10 phases; substantive 1-3h deep work on one module; elevated quality bar (research_local deeper; regression_test_author authors broader coverage)"
      timeout_ceiling: "10800s (3h)"

  failure_modes_and_recovery:
    lock_stale: "PID dead OR age ≥90min → next fire's acquire_decision detects stale + reclaims (concurrency_control)"
    process_crash_mid_fire: "Lock leaked; next fire's stale-check reclaims; in-flight git stage state may need operator-review of partial work (worker REPORTS-FORM in fire-summary friction_observed; does NOT recommend per output_governance)"
    pipeline_post_failure: "STEP 9 captures errors; worker logs to fire-summary friction_observed; does NOT proceed to next loop iteration until pipeline-post green"
    operator_directive_gap: "STEP 0's in_session_directive_gate catches; author raw/notes/ FIRST per Hard Rule 3 before STEP 1+"
    operator_mid_session_commit: "STEP 0's git_state_refresh detects (per fire's start-marker comparison); subsequent r20_gate uses fresh state; worker REPORTS the commits in friction_observed (operator action, not worker action)"
    phantom_mcp_tool_request: "mcp_discipline catches; worker rolls back invocation + surfaces Q## per output_governance.surface_form"
    overstep_caught_at_emission: "output_governance.self_audit_at_emission catches recommendation-form lines; worker regenerates in report_form / surface_form / question_form before emission"

  why_this_block_exists: "The 6 policy blocks above describe DIFFERENT slices of fire-cycle behavior. This block answers 'what happens when a fire runs?' end-to-end with explicit cross-references. New synergy iterations consult worker_runtime_model FIRST (single navigable home for runtime semantics) BEFORE drilling into specific doctrines. This is the P2 (Structured Context) composition layer per sub-model-knowledge-architecture navigation-hub pattern."

  second_brain_anchors:
    - "P2 Structured Context Governs Behavior — composition-as-structure"
    - "wiki/spine/super-model/knowledge-architecture.md — sub-model navigation-hub pattern"
    - "wiki/spine/models/quality/model-sfif-architecture.md — recursive workflow at task scope (per workflow.canonical_pipeline)"
    - "wiki/lessons/03_validated/methodology-process/the-agent-must-practice-what-it-documents.md — composition is operative, not aspirational"

