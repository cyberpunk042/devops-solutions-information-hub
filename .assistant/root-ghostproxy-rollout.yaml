      - "ZERO modifications to sister repos OTHER than root-ghostproxy"
      - "ZERO commits by the agent (R20)"
      - "ZERO git rm on tracked files without prior accepted Q## (R20)"

    verification_compliance:
      - "Every status:review task has Done When all green + verification output in Resolution"
      - "Every multi-file fix passes ~/root-ghostproxy/install.sh --dry-run"

    pipeline_compliance:
      - "Second-brain pipeline_post 0 NEW errors per session (when second-brain wiki edited)"

  per_outcome_attestation:
    # NEW Iteration J (v5.3.1) — close P4 cascade at success-layer with concrete verification commands.
    # Per [[declarations-are-aspirational-until-infrastructure-verifies-them|Principle 4]]: every
    # observable_outcome declaration above is ASPIRATIONAL until paired with a concrete
    # verification_command + target threshold + attestation_method + failure_remediation. This
    # block makes the success-criteria layer verifiable, not declarative. Operator can run any
    # verification_command at any time to attest the outcome holds.
    rationale: "Per P4 cascade: schema enforcement → per-type page-standards → methodology gate commands → profile success criteria + telemetry. Without per-outcome verification commands, success_criteria.observable_outcomes are declarations the worker may or may not deliver. This block makes each outcome falsifiable via concrete verification."

    execution:
      steady_review_rate:
        outcome_ref: "observable_outcomes.execution[0] — tasks moved current_stage → status:review at steady rate"
        target: "≥1 task/day steady-mode; ≥3 tasks/day sprint-mode (per measurable_progress_per_week aggregation)"
        verification_command: |
