    p4_cascade_attestation: "All observable_outcomes + retirement_criteria + measurable_progress targets are now paired with concrete verification_command + target + attestation_method + p4_compliance proof + failure_remediation. Per [[declarations-are-aspirational-until-infrastructure-verifies-them|Principle 4]]: the success-layer is no longer aspirational; every claim is GATE-VERIFIABLE at fire-time + weekly aggregation. Operator can run any verification_command above at any time to attest the outcome holds."

    second_brain_anchors:
