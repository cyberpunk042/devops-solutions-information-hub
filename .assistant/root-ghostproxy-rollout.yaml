  mcp_discipline:
    # NEW v5.3 — per CLAUDE.md routing.md MCP catalog 3-predicate discipline +
    # wiki/lessons/.../mcp-discipline-register-only-what-is-referenced-and-actually-used-not-pre-emptive.md
    # Closes the agent-config × workflow synergy gap: tools the worker has access
    # to but doesn't USE are phantom catalog entries (P4 violation — declarations
    # aspirational until verified).
    rationale: "Per CLAUDE.md routing.md MCP-catalog discipline: MCP tools used by the worker must satisfy 3 predicates simultaneously: (1) REFERENCED in this profile (subagents.<name>.tools or workflow.canonical_pipeline.step_<n>); (2) ROUTED-TO via an explicit operator-intent dispatch at some workflow step or subagent; (3) ACTUALLY CALLED (invoked at least once across the worker's lifetime per fire-summary evidence). Tools not satisfying all 3 are phantom catalog entries (P4 violation per [[mcp-discipline-register-only-what-is-referenced-and-actually-used-not-pre-emptive]] lesson). The worker NEVER invokes MCP tools not on the referenced list — surface as Q## first."
    three_predicates:
      referenced:
        what: "Tool is named in subagents.<name>.tools OR workflow.canonical_pipeline.step_<n>.tools, with an operator-intent mapping (which user-intent triggers this tool)"
        gate: "`grep -E '<tool-name>' .assistant/root-ghostproxy-rollout.yaml` returns ≥1 match per referenced tool"
      routed:
        what: "Tool is dispatched from a specific workflow step OR subagent (not just abstractly listed); the dispatch path is traceable from operator-intent → workflow step → subagent → MCP-call"
        gate: "Each referenced tool has ≥1 subagent OR workflow step that invokes it (per subagents.<name>.tools field; cross-checked at grep audit)"
      actually_called:
        what: "Tool invoked ≥1 time across the worker's lifetime (or, if profile is new, the dry-run in pre_launch_readiness.first_run_readiness exercises it)"
        gate: "Per-fire summary's `did` section cites tool invocation when a fire uses it; over 10+ fires, ≥1 cite per referenced tool (else tool is phantom — surface Q## for removal)"
    current_referenced_mcp_tools:
      # Each entry: tool name + which subagent/workflow-step references it + intended use + actually-called attestation
      wiki_search:
        referenced_at: "subagents.research_local.tools"
        routed_via: "research_local subagent at workflow STEP 3 (load_context — second-brain cross-reference for picked task) + STEP 4a (spec_check — [NEEDS CLARIFICATION] resolution)"
        actually_called_attestation: "PENDING first 10 fires post-install; pre-launch dry-run on first-pick task should exercise it"
      wiki_read_page:
        referenced_at: "subagents.research_local.tools"
        routed_via: "research_local at STEP 3 (target second-brain page deep-read for context — e.g., audit-cluster source page)"
        actually_called_attestation: "PENDING first 10 fires"
      wiki_list_pages:
        referenced_at: "subagents.research_local.tools"
        routed_via: "research_local at STEP 3 (domain enumeration when audit cluster spans multiple second-brain pages)"
        actually_called_attestation: "PENDING first 10 fires"
      wiki_fetch:
        referenced_at: "subagents.research_online.tools"
        routed_via: "research_online at STEP 4a (operator-anchored URL verification for [NEEDS CLARIFICATION] external-evidence resolution); RARE — operator-anchored only, NOT mass external ingestion (that's CR's lane per identity.what_this_profile_is_NOT)"
        actually_called_attestation: "PENDING (likely rare; only when operator names a specific URL the worker should verify against)"
      wiki_log:
        referenced_at: "subagents.pm_scrum_facilitator.tools"
        routed_via: "pm_scrum_facilitator at STEP 10 (operator-decision-queue Q## surfacings with cascade markers)"
        actually_called_attestation: "PENDING first 10 fires; expected use per Q## surfacings + cross-cycle fallback level_4 chain"
    forbidden_phantom_tools:
      rule: "If a fire encounters a need for an MCP tool NOT listed in current_referenced_mcp_tools, the worker SURFACES the need to operator-decision-queue.md as Q## with cascade:root-ghostproxy + decision_needed:add-mcp-tool-<name>-to-profile BEFORE using it. NEVER autonomous-use of un-listed tools (P4 violation by definition — adding a tool to the registry is operator-territory per output_governance.execution_overstep_filter)."
      detector: "Fire's `did` section names an MCP-tool invocation that doesn't match any current_referenced_mcp_tools entry"
      response: "ROLLBACK the invocation; SURFACE Q## per rule; continue fire without the unauthorized tool"
    audit_cadence:
      grep_audit: "On every profile-YAML edit, grep referenced tools against current_referenced_mcp_tools list; any field in `subagents.*.tools` referencing an MCP tool MUST have a matching current_referenced_mcp_tools entry"
      phantom_cleanup: "Every 10 fires, run `grep -c <tool-name>` across last 10 fire-summaries; if 0 cites for a referenced tool → tool is phantom → surface Q## for removal"
    second_brain_anchors:
      - "CLAUDE.md routing.md (MCP catalog with 3-predicate discipline)"
      - "wiki/lessons/.../mcp-discipline-register-only-what-is-referenced-and-actually-used-not-pre-emptive.md (P4 instance at MCP layer)"
      - "wiki/lessons/04_principles/hypothesis/declarations-are-aspirational-until-infrastructure-verifies-them.md (P4 — generalized)"
    composition_with_other_blocks:
      - "output_governance.execution_overstep_filter — adding/removing MCP tools is operator-territory; phantom tool requests SURFACE Q## (per filter)"
      - "anti_patterns.methodology_bypass — MCP-tool invocation bypassing the 3-predicate gate is a doctrine bypass"
      - "subagents.*.tools — each tools list cross-checks against current_referenced_mcp_tools"

