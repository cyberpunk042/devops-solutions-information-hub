        - "When to run Path G operator-action unlock sequence (Steps 1-6)? Recommended: after first 3-5 driven-tick fires demonstrate worker shape + before scope grows beyond what 195k holds comfortably (e.g., when authoring 80+ new tasks at once)"
        - "Should context_limits scale proportionally to 4× on unlock (Step 6 recommendation) OR conservatively (e.g., 2×)?"

    claude_cli_invocation_params:
      # The cron-spawned agent receives these from openclaw.json5 → claude-cli `-p` invocation
      model: "anthropic/claude-opus-4-7 (with 1M variant pending verification above)"
      thinking: "high (per profile.thinkingDefault in openclaw.json5)"
      reasoning: "on (per profile.reasoningDefault)"
      fast_mode: "false (per profile.fastModeDefault — substantive work, not fast-output)"
      cache_retention: "long (per profile.params.cacheRetention — reuse cache across fires for speed)"
      context_injection: "always (per profile.contextInjection — system prompt + bindings always present)"
      heartbeat_cadence: "every 4h (keeps session warm; refreshes OAuth before expiry)"

    sandbox_state:
      mode: "off (per profile.sandbox.mode — worker writes target project directly; needs filesystem access)"
      elevated_tools: "false (per profile.tools.elevated.enabled — worker doesn't escalate)"
      rationale: "Worker scope is bounded by tools.allow + tools.deny in openclaw.json5; sandbox isolation would block legitimate target-project writes"

    context_limits:
      bootstrapMaxChars: 16000
      bootstrapTotalMaxChars: 80000
      toolResultMaxChars: 32000
      postCompactionMaxChars: 2400
      compaction_mode: "safeguard (keepRecentTokens: 80000)"
      sized_for: "195k context (default opus-4-7)"
      scale_for_1m: "If 1M mode confirmed → scale proportionally: bootstrapTotalMaxChars 80k → 320k; toolResultMaxChars 32k → 128k; keepRecentTokens 80k → 320k. Operator-decision on whether to scale aggressively or conservatively."

    auth_lifetime:
      provider: "anthropic:claude-cli (OAuth via Claude CLI native auth)"
      expiry: "~6h per OAuth token (verified 2026-05-16 mid-session: 'anthropic:claude-cli expiring expires in 6h')"
      refresh_path: "openclaw models auth login --provider anthropic (operator-triggered when expired)"
      relevance: "For 24/7 operation, OAuth refresh cadence is part of runtime discipline. Cron heartbeat every 4h refreshes BEFORE expiry. Operator may add auto-refresh logic to tools/assistant.py if needed."
      monitor_command: "openclaw models status (shows OAuth expiry)"

    proper_settings_attestation:
      # All settings verified BEFORE install (operator-doctrinal: 'make sure its in opus 1m
      # context mode and with the proper settings')
      verified_pre_install:
        - "model.primary set to 1M variant (or alias)"
        - "thinking/reasoning/cache_retention per profile defaults"
        - "context_limits scaled to context-window size"
        - "sandbox.mode=off + elevated=false"
        - "OAuth fresh (expires_in > 4h before first fire)"
        - "heartbeat cadence 4h ≤ OAuth expiry"
      verification_method: "Pre-launch dry-run reports each setting + value + source-of-truth file; operator inspects before GO signal"

