# -----------------------------------------------------------------------------
# Bootstrap Idempotency (Item 6 — fix: bootstrap re-fires waste on every install)
# -----------------------------------------------------------------------------
bootstrap_idempotency:
  rationale: "Bootstrap one-shot currently fires on every install via OpenClaw post-install one-shot mechanism. On a re-install (e.g., profile edit + re-install for verification), bootstrap re-generates full planning artifact wasting compute. Right behavior: detect already-bootstrapped state and short-circuit to lightweight verification."
  marker_file:
    path: ".assistant/_state/root-ghostproxy-rollout-bootstrap-marker.md"
    written_at: "End of FIRST successful bootstrap fire (full planning artifact produced + operator-reviewable)"
    content_fields:
      - "status: complete | partial | failed"
      - "first_bootstrap_timestamp (ISO8601)"
      - "first_pick_task_id"
      - "planning_artifact_path (inbox excerpt or dedicated file)"
      - "operator_review_status: pending | reviewed | approved"
  detect_already_bootstrapped:
    # Per cron bootstrap-observation STEP 1 state_check (Item 6 edit)
    criteria_any:
      - "marker_file exists with status:complete"
      - "inbox contains ≥1 prior BOOTSTRAP entry with post:ok in last 14 days"
    on_already_bootstrapped: "Skip full planning artifact regeneration. Run lightweight verification (14 bindings present + target_project accessible + git clean + last planning artifact still applicable). Append inbox one-liner: HH:MM ET | BOOTSTRAP-SKIP | reason:already_bootstrapped | verification:<pass|fail>. END."
    on_fresh_signal: "Run full bootstrap planning artifact. At END, write marker_file with status:complete + fields populated."
  invalidation:
    # When SHOULD a re-bootstrap legitimately run?
    triggers_invalidating_marker:
      - "Operator writes BOOTSTRAP-RESET directive in operator-directives.md"
      - "Major operator-directives.md updates since marker (>5 new directive raws OR explicit re-orient request)"
      - "Target project structure changed materially (epic_modules_pattern glob results differ by >50%)"
      - "Marker age > 30 days (assume operator-managed state may have drifted)"
    on_invalidation: "Worker rm's marker (untracked file — R20-safe), re-fires bootstrap on next install or operator-trigger"

# -----------------------------------------------------------------------------
# Concurrency Control (Item 7 — fix: bootstrap × driven-tick race on git stage)
# -----------------------------------------------------------------------------
concurrency_control:
  rationale: "Bootstrap one-shot fires post-install + driven-tick fires every 15 min. After an install the bootstrap fire may still be running when the first driven-tick fires. Both can hold git stage state in ~/root-ghostproxy/ simultaneously → race condition on `git add` operations + interleaved Resolution writes. Lock-file mutual exclusion prevents."
  lock_file:
    path: ".assistant/_state/root-ghostproxy-rollout.lock"
    content_fields: [pid, iso_timestamp, fire_variant (BOOTSTRAP|DRIVEN|WEEKLY)]
    written_at: "STEP 1 state_check of each cron fire (after acquisition decision)"
    released_at: "STEP 10 loop_or_declare END of each cron fire (cleanup; even on error path)"
  acquire_decision:
    # Per cron bootstrap + driven + weekly STEP 1 mutual-exclusion check
    if_no_lock: "Acquire (write current PID + ISO timestamp + variant); proceed"
    if_lock_held_pid_alive_age_lt_30min: "SHORT-CIRCUIT: log 'lock held by PID <n> since <ts> for variant <v>; this fire deferring'; END (no work)"
    if_lock_held_pid_dead: "Consider lock stale (process crashed without cleanup); LOG warning + acquire fresh lock; proceed"
    if_lock_age_ge_30min: "Consider lock stale (assume hung process); LOG warning + acquire fresh lock; proceed"
  release_at_end:
    happy_path: "STEP 10 loop_or_declare END → rm lock file"
    error_path: "On any exception bubbling to fire-end: still rm lock file (cleanup invariant)"
    crash_recovery: "If process is killed mid-fire without cleanup: next fire's acquire_decision detects stale lock + reclaims"
  why_lock_file_vs_systemd_unit_dependency: "Per operator no-OpenClaw-touch doctrine: the fix lives in the profile/state-file layer, not the systemd unit. Lock-file is profile-level + portable across OpenClaw runtime changes."

# -----------------------------------------------------------------------------
# Announce Channel Policy (Item 8 — fix: announce → no route delivery error)
# -----------------------------------------------------------------------------
announce_channel_policy:
  observed_error: "'announce → last → no route' error appeared persistently in cron fires. Cause: OpenClaw announce channel referenced by agent runtime but no destination channel wired in openclaw.json5 surfaces config."
  policy: "Worker does NOT use OpenClaw announce channel. ALL operator-facing surfacing routes via PROFILE-OWNED FILES (no runtime channel dependency)."
  routing_table:
    per_tick_summary: ".assistant/_state/root-ghostproxy-rollout-inbox.md (one-liner per fire per profile telemetry.one_line_per_tick format)"
    per_fire_detail: ".assistant/_state/root-ghostproxy-rollout-fire-summary.md (verbose 'did X / surfaced Y / next plans Z' per Item 24 — see operator_facing_fire_summary policy)"
    operator_pending_decisions: "wiki/backlog/operator-decision-queue.md as Q## entries with cascade:root-ghostproxy + decision_needed:<slug>"
    cross_sister_friction: "Same as operator_pending_decisions (Q## in second-brain queue)"
    task_resolution_evidence: "Resolution section of the task's own page in ~/root-ghostproxy/wiki/backlog/tasks/T*.md (worker-edited; operator validates)"
    bootstrap_artifact: ".assistant/_state/root-ghostproxy-rollout-bootstrap-marker.md (Item 6) + planning artifact in inbox"
  silencing_announce_at_runtime:
    note: "No OpenClaw-runtime edit needed (operator no-touch doctrine). The agent simply does not invoke announce; OpenClaw runtime's 'no route' warning becomes innocuous (agent doesn't generate the events that would need routing)."
    fallback_if_announce_still_emits: "If OpenClaw runtime still auto-emits announce events for system-level things (e.g., fire-start / fire-end markers) the 'no route' is harmless tracing; ignore. Document as known-cosmetic in handoff."

