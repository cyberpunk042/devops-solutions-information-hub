# Success criteria
# -----------------------------------------------------------------------------
success_criteria:
  distillation:
    - "0-1 well-anchored level-up draft per week"
    - "operator-accept rate > 60% on level-up drafts"
  retroactive:
    - "Untracked clear-trash removed autonomously (no operator-touch needed for these)"
    - "Tracked clear-trash surfaced as ONE batch Q## per signature class (operator decides once, agent executes)"
    - "Pile ratio decreasing or stable (NEVER_DEPILED → PILING_UP → DEPILED)"
  pollution_control:
    - "Anti-pattern `pollution_growth_without_acceptance` triggers ≤ 1 per quarter (early-warning, not chronic)"
    - "Anti-pattern `deletion_of_committed_without_agreement` triggers ZERO times (sacrosanct)"
  self_improvement:
    - "Own profile incrementally tuned based on operator-feedback"
  pipeline:
    - "pipeline_post 0 NEW errors per tick"
