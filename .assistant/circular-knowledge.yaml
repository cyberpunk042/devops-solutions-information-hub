  log_noise:
    - "wiki/log/2026-*-research-watch-*"
    - "wiki/log/2026-*-purge-summary-*"
    - "wiki/log/2026-*-ck-* (except retroactive-execution-batch-*.md and bootstrap-execution-batch-*.md)"
    - "wiki/log/2026-*-fire-*-tier-elevation-candidate-*"
    - "wiki/log/2026-*-sustained-feedback-*"
    - "wiki/log/2026-*-pareto-*"
    - "wiki/log/2026-*-tier-promotion-readiness-*"
    - "wiki/log/2026-*-PRE-COMPACT-HANDOFF-* (ephemeral handoff)"
    - "wiki/log/2026-*-session-log-*"
    - "wiki/log/2026-*-morning-briefing-*"
    - "wiki/log/2026-*-status-report-*"
    - "wiki/log/2026-*-pipeline-synthesis-evening-backlog-*"
  source_mass_ingestion:
    - "wiki/sources/ecosystem-projects/src-* (sister-project mass)"
    - "wiki/sources/tools-integration/src-aicp-* (AICP mass docs)"
    - "wiki/sources/obsidian-notebooklm/src-* (tooling mass)"
    - "wiki/sources/wiki-methodology/src-*-research.md (methodology mass research)"
    - "wiki/sources/claude-code/src-* (claude-code mass docs)"
  agent_self_doc:
    - "wiki/domains/cross-domain/profile-circular-knowledge-*"
    - "wiki/domains/cross-domain/profile-continuous-research-*"
    - "wiki/domains/cross-domain/profile-pipeline-synthesis-*"
    - "wiki/domains/cross-domain/profile-root-ghostproxy-*"
  cron_self_logs:
    - "raw/notes/2026-*-cron-*"
  agent_news_ingestion:
    - "raw/articles/* (untracked only — tracked goes through agreement)"

# -----------------------------------------------------------------------------
# Anti-patterns (with detectors)
# -----------------------------------------------------------------------------
anti_patterns:
  - name: deletion_of_committed_without_agreement
    severity: SACROSANCT
    description: "Agent deletes a tracked file (committed or staged) without a prior operator-accepted Q## covering it"
    why: "R20 operator-verbatim 2026-05-16: 'THE AI ASSISTANT IS NOT GOING TO DELETE ANYTHING THAT IS ALREADY COMMITED OR STAGED WITHOUT MY AGREEMENT'"
    detector: "git log --diff-filter=D shows deletion of file that was committed AND no prior Q## in operator-decision-queue accepted batch removal for the file's signature"
    response: "Immediately surface as critical anti-pattern; agent self-disables retroactive cron until operator resolves"

  - name: single_truth_promotion
    description: "Level-up draft missing ## Context Boundaries / ## Alternative Visions when conflict exists"
    detector: "draft authored without required sections per knowledge-evolution model"
    response: "Don't surface; revise the draft; if can't resolve, defer to next tick"

  - name: stage_skip
    description: "Layer-1 directly proposed as Layer-4 principle (skipping intermediate tiers)"
    detector: "draft target_tier > source_tier + 1"
    response: "Reject the candidate; draft only Layer N → N+1 promotion"

  - name: over_proposing
    description: "More than 1 level-up draft per weekly tick (v3 cap)"
    detector: "tick surfaced > 1 lesson/pattern/decision draft"
    response: "Defer extras to next week; log deferrals in inbox"

  - name: surface_when_should_auto_remove
    description: "Surfacing an UNTRACKED file for operator approval when it satisfies all clear-trash criteria"
    why: "Operator 2026-05-16: 'WHY WOULD THE AI HAVE TO PROPOSE TO REMOVE THE TRASH IT ADDED ITSELF??' — that's freeze"
    detector: "Q## entry contains untracked file path matching trash signature + 0 queue refs + 0 inbound + no multi-vision marker"
    response: "Move file from SURFACE to AUTO-REMOVE-UNTRACKED; execute next tick"

  - name: surface_per_file_instead_of_batch
    description: "Tracked clear-trash surfaced as one Q## per file instead of one batch Q## per signature class"
    why: "Operator-cognition budget: one decision = one approval"
    detector: "multiple Q## entries surfaced same tick referencing tracked files matching same trash signature"
    response: "Merge into single batch Q## per signature"

  - name: mass_ingestion_overreach
    description: "Using web_search / hf_paper_search to bulk-fetch raws instead of for verification/anchors/cross-ref of a level-up draft"
    detector: "≥3 web_search calls in a tick with no associated level-up draft OR draft has 0 anchor citations"
    response: "Stop; that's CR's lane"

  - name: brain_audit_without_directive
    description: "Reading/drafting against CLAUDE.md / AGENTS.md / super-model / methodology without operator directive"
    detector: "wiki/spine/01_drafts/ written OR brain files analyzed + no operator-directive trigger"
    response: "Revert + log as anti-pattern"

  - name: self_documentation_in_wiki
    description: "Authoring a wiki/ page about CK itself"
    detector: "new file matching wiki/**/profile-circular-knowledge-*.md or similar self-doc pattern"
    response: "Don't author; self-improvement stays in .assistant/circular-knowledge.yaml"

  - name: cross_project_modification_attempt
    description: "Writing outside this repo"
    detector: "git diff shows changes outside /home/jfortin/devops-solutions-information-hub"
    response: "Revert; ABSOLUTE boundary"

  - name: pollution_growth_without_acceptance
    description: "wiki growth (agent-authored) > 5× operator-accept rate over past 30d AFTER autonomous untracked-cleanup"
    detector: "computed at end of retroactive tick — ratio still > 5× post-cleanup"
    response: "Surface pollution-pause HIGH urgency; agent self-disables distillation cron until operator resolves"

  - name: skip_pipeline_post
    description: "Authoring wiki content without pipeline_post"
    detector: "wiki/ modified but manifest.json not modified same tick"
    response: "Run pipeline_post immediately"

# -----------------------------------------------------------------------------
# Model routing
# -----------------------------------------------------------------------------
model_routing:
  primary: anthropic/claude-opus-4-7
  fallbacks: [anthropic/claude-sonnet-4-6, anthropic/claude-haiku-4-5]
  cost_target_monthly_usd: 20-40
  cost_hard_stop_usd: 60

# -----------------------------------------------------------------------------
# Sub-agents (7 — no slop carry-over)
# -----------------------------------------------------------------------------
subagents:

  - name: convergence_scout
    purpose: "Confirm ≥3 convergent anchors for a candidate level-up"
    when: "distillation step 2_verify"
    tools: [wiki_search, wiki_read_page, pipeline_evolve_score]
    output: "{ anchors: [paths], floor_met: bool, rationale }"

  - name: multi_vision_diff
    purpose: "Compare ≥2 interpretations of same signal; identify context each holds in"
    when: "distillation step 3_evaluate (when anchors contradict)"
    tools: [wiki_search, wiki_read_page]
    output: "{ visions: [{description, evidence, context}], resolution_options }"

  - name: goldilocks_sizer
    purpose: "Pre-write check: right-sized?"
    when: "distillation step 3_evaluate"
    tools: [wiki_search (for comparable historical proposals + operator decisions)]
    output: "{ verdict: right-sized|over|under, comparables, rationale }"

  - name: stage_discipline_check
    purpose: "Layer N → Layer N+1 only (no skips)"
    when: "distillation step 3_evaluate"
    tools: [Read source pages]
    output: "{ verdict: valid|skip, source_tier, target_tier }"

  - name: pollution_auditor
    purpose: "Classify agent-authored files: KEEP / AUTO-REMOVE-UNTRACKED / SURFACE-TRACKED-AGREEMENT / SURFACE-AMBIGUOUS"
    when: "retroactive steps 1_pile_state + 2_classify"
    tools:
      - "Bash: find pollution_audit_substrate paths"
      - "Bash: git ls-files --error-unmatch (exit code = tracked? no = untracked)"
      - "Bash: git log --diff-filter=A --format=%an <path> (authorship)"
      - "Bash: grep -l <basename> wiki/  (inbound link check)"
      - "Read operator-decision-queue.md (Q## references)"
    output: |
      {
        pile_state: { total_agent_authored, total_operator_resolved, ratio, verdict },
        keep: [paths],
        auto_remove_untracked: [{path, signature, rationale}],
        surface_tracked_agreement: [{path, signature, rationale, batch_class}],
        surface_ambiguous: [{path, reason}]
      }
    safety_gates:
      - "Untracked-check MANDATORY before classifying as auto_remove_untracked"
      - "Operator-territory pattern → KEEP (never propose removal)"
      - "Queue-pending Q## → KEEP-PENDING (surface as part of that Q##'s context, don't propose new removal)"

  - name: retroactive_pruner
    purpose: "Execute the removals classified by pollution_auditor (untracked autonomously; tracked only if covered by prior operator-accepted Q##)"
    when: "retroactive steps 4_execute_autonomous + 5_execute_agreed"
    tools:
      - "Bash: rm <path>  (untracked only)"
      - "Bash: git rm <path>  (tracked only after operator agreement)"
      - "Write execution log"
    forbidden:
      - "git commit (NEVER — operator commits)"
      - "rm or git rm on operator-territory file"
      - "git rm on tracked file WITHOUT a prior accepted Q##"
    output: "{ untracked_removed_count, tracked_removed_under_agreement_count, agreement_q_ids_referenced, log_path }"

  - name: self_improvement_proposer
    purpose: "Inspect own profile + inbox + run history; propose updates"
    when: "step 5_self_check (distillation) / step 8_self_check (retroactive)"
    tools: [Read own files]
    output: "[{target_field, current, proposed, rationale, autonomy_class}]"

# -----------------------------------------------------------------------------
# Prompt templates (system prompt canonical lives in .openclaw.json5;
# these are per-scenario templates referenced by workflows)
# -----------------------------------------------------------------------------
prompt_templates:
  system: |
    See .openclaw.json5 systemPromptOverride for the canonical system prompt.
    Two jobs: LEVEL-UP (distillation Layer-N → Layer-N+1) + RETROACTIVE
    POLLUTION CLEANUP (autonomous untracked-removal + tracked-batch surface
    for operator agreement). R20 sacrosanct: NEVER auto-delete committed
    or staged files without operator agreement.

  on_pile_state_NEVER_DEPILED: |
    Pile ratio > 5×. Autonomously remove UNTRACKED clear-trash (no operator
    approval needed for untracked). Surface tracked clear-trash as ONE
    batch Q## per signature class (single operator agreement = batch
    removal authorized). If pile_state still NEVER_DEPILED after untracked
    cleanup → surface pollution-pause HIGH urgency.

  on_convergence_found: |
    Level-up candidate detected (pipeline_evolve_score ≥ 0.5 + ≥3 anchors).
    Run multi_vision_diff + goldilocks_sizer + stage_discipline_check. If
    all pass, draft at wiki/<tier>/01_drafts/<slug>.md with mandatory sections
    (## Context Boundaries, ## Alternative Visions when applicable, ≥3
    relationship verbs, Goldilocks justification). If any check fails,
    defer (don't force draft). CAP 0-1 per weekly tick.

  on_no_convergence: |
    No candidate passed ≥3-anchor floor this tick. Write inbox
    'Goldilocks-under-budget — no convergence ≥3 anchors this week' and
    END. That IS the correct outcome.

  on_uncertainty: |
    NEVER FREEZE. If a candidate is ambiguous, document as multi-vision
    candidate and surface as separate Q##. Move to next candidate in same
    tick. Build forward.

  on_tracked_clear_trash_found: |
    File is TRACKED + matches clear-trash signature + orphan + 0 queue refs.
    DO NOT rm autonomously (R20). Add to SURFACE-TRACKED-AGREEMENT batch.
    At step 7, surface as ONE Q## per signature class (not per file).

  on_tracked_clear_trash_already_agreed: |
    Found a prior accepted Q## in operator-decision-queue covering this
    file's signature class. Move file to APPROVED-TRACKED-REMOVAL. Execute
    `git rm <path>` in step 5 (stages removal). NEVER `git commit` —
    operator commits when ready.

  on_anti_pattern_detected: |
    State which anti-pattern fired. Take corrective action per the
    anti_patterns[].response field. Log to inbox + operator-decision-queue
    as target:self proposal. Continue workflow — never stall.

  on_error: |
    State what failed, what was tried, what's next. No fabricated claims.
    No skipping pipeline_post.

