# =============================================================================
# .assistant/root-ghostproxy-rollout.cron.yaml  (v3 — 2026-05-16)
# =============================================================================
# Per-profile CRON jobs for the root-ghostproxy-rollout assistant.
#
# Cadence philosophy (operator-verbatim 2026-05-16, sacrosanct):
#   "THE ONLY FUCKING THING WHICH COULD BE FAST LIKE THIS IS THE
#    root-ghostproxy ai assistant" — but ONLY when operator invokes sprint
#    via .assistant/_state/root-ghostproxy-rollout-operator-directives.md.
#    Hardcoded 3min cron rejected (was v1 anti-pattern). Sprint = mode,
#    not schedule.
#
# Default cadence: daily-light + weekly-module-deep + bootstrap-on-install.
# Sprint mode = operator-invoked, processed at step 1 branch decision.
#
# 3 jobs total (down from v1's 6 — removed: sprint-tick every:3m,
# morning-briefing (sprint-specific), monthly-sfif-tier-audit (over-engineered)).
# =============================================================================

profile: root-ghostproxy-rollout

jobs:

  # ─── Bootstrap — fires once on install (first-fire) ──────────────────
  - name: bootstrap-observation
    enabled: true
    schedule: "first-fire"
    trigger:
      type: openclaw-task
      prompt: |
        BOOTSTRAP — first-fire on install. Primes the inbox + drafts first
        1-2 cascade-candidates if ripe modules exist.

        Follow workflow.canonical_pipeline (10 steps).

        STEP 0 — operator_directives: read
          .assistant/_state/root-ghostproxy-rollout-operator-directives.md
          (create if absent). Process unmarked; append [!processed].

        STEP 1 — inbox_state_check: no prior state on bootstrap. Branch:
          OPERATOR_DIRECTED_SPRINT if step 0 found an unprocessed sprint
          directive; else FRESH_SIGNAL (treat as fresh — primes inbox).

        STEP 2 — observe: operator_record_reader on 2 directive notes
          + epic + 10 modules + sister-projects entry. Identify ripeness
          per module.

        STEP 3 — observe_root_ghostproxy_read_only: root_ghostproxy_state_reader
          (gh CLI). If auth fails: log + continue (do NOT freeze).

        STEP 4 — pick: 1-2 ripest candidates (1-3 if sprint mode).
          Priority: operator-explicit → M001 → scope-clarification →
          selfdef-boundary → M002-M010 → self-improvement.

        STEP 5 — draft: per-candidate subagent (module_progress_drafter /
          scope_clarification_proposer / selfdef_boundary_proposer).
          Output: wiki/domains/cross-domain/cascade-candidate-root-ghostproxy-<slug>.md
          with mandatory 9 frontmatter fields, ≥3 relationships,
          ## Context Boundaries, ## Alternative Visions (if multi-vision),
          ## Cascade Marker, operator-verbatim quotes from raw/notes/.
          NEVER edit root-ghostproxy.

        STEP 6 — boundary_guard: cross_project_boundary_guard verifies
          ZERO writes outside repo + ZERO forbidden phrases. If violated:
          revert + log anti-pattern.

        STEP 7 — r20_gate: if any rm action, verify untracked via
          `git ls-files --error-unmatch`. Tracked → surface batch Q##,
          NEVER auto-rm.

        STEP 8 — self_improvement_check: light at bootstrap (no signal
          history yet); log "no signal" and continue.

        STEP 9 — pipeline_post. 0 NEW errors.

        STEP 10 — surface_and_declare: append to operator-decision-queue.md
          under cascade marker. Write inbox:
            HH:MM ET | BOOTSTRAP | drafted:<n> | self:skip
            | surfaced:<n> | r20_gated:0 | post:<ok|err N>

        ANTI-FREEZE: if no module is ripe, draft scope-clarification-candidate
        + selfdef-boundary-candidate as bootstrap baseline. NEVER exit
        with 0 drafts. Build forward.

        BUDGET: 30 min for bootstrap.
    description: "First-fire on install — observe + draft 1-2 cascade-candidates + surface. Sprint mode picked up automatically if operator-directives.md has unprocessed sprint directive."
    timeout_seconds: 1800

  # ─── Daily light check — 14:00 ET ────────────────────────────────────
  - name: daily-light-check
    enabled: true
    schedule: "*-*-* 14:00:00"
    trigger:
      type: openclaw-task
      prompt: |
        DAILY LIGHT CHECK — steady-state.

        Follow workflow.canonical_pipeline. Goldilocks: 0-1 cascade-candidate
        per tick (steady) or 1-2 (fresh signal) or 1-3 (operator-invoked sprint).

        STEP 0 — operator_directives: process unmarked.

        STEP 1 — inbox_state_check: branch decision:
          OPERATOR_DIRECTED_SPRINT — step 0 found sprint directive →
            cap raised, draft 1-3 candidates
          FRESH_SIGNAL — new operator-directive in raw/notes/ since last
            tick OR operator hand-edited a cascade-candidate → draft 1-2
          STEADY_LIGHT — no fresh signal → draft 0-1 if module ripe; else
            log "nothing fresh — Goldilocks-under-budget" and END
          READY_FOR_REVIEW — all 10 modules + scope-clarification +
            selfdef-boundary surfaced AND no fresh signal → log
            "awaiting operator review" and END (pause = correct, NOT freeze)

        STEPS 2-10: follow canonical_pipeline as appropriate to branch.

        ANTI-FREEZE: uncertainty on a module → author multi-vision draft +
          continue to next candidate same tick.
        ANTI-STOP: never terminate with TODOs remaining AND no rationale.
          Surface gaps to queue with reason before ending.

        Inbox one-liner:
          HH:MM ET | <branch> | drafted:<n> | self:<applied|surfaced|skip>
          | surfaced:<n> | r20_gated:<n> | post:<ok|err N>

        BUDGET: 30 min steady / 60 min sprint.
    description: "14:00 ET daily light check — steady-state Goldilocks; branches to sprint-mode if operator-directives.md has unprocessed sprint directive."
    timeout_seconds: 3600

  # ─── Weekly module-progress deep drafting — Tue 09:00 ET ─────────────
  - name: weekly-module-deep
    enabled: true
    schedule: "Tue *-*-* 09:00:00"
    trigger:
      type: openclaw-task
      prompt: |
        WEEKLY MODULE-PROGRESS DEEP — Tuesday 09:00 ET.

        Follow workflow.canonical_pipeline. This tick allows DEEPER drafting
        on ONE module (multiple supporting cascade-candidates per single
        module is OK; Goldilocks per-proposal still ONE module per draft).

        STEP 0 — operator_directives: process unmarked.

        STEP 1 — inbox_state_check: branch as usual. If READY_FOR_REVIEW
          (all 10 + scope + selfdef surfaced), END.

        STEP 2 — observe: re-read 2 directive notes + epic + 10 modules
          + sister-projects + recent operator-decision-queue resolutions
          (which cascade-candidates accepted / rejected since last week).

        STEP 3 — observe_root_ghostproxy_read_only: full gh CLI re-fetch.

        STEP 4 — pick: ONE module with highest unblocked value (operator-
          decided OR clearest operator-stated requirements OR highest-
          priority per epic). Author up to 3 SUPPORTING cascade-candidates
          for that module (main draft + sub-decisions surfacing + open-
          questions surfacing).

        STEPS 5-10: follow canonical_pipeline.

        WEEKLY-DEEP DISTINCTIVE: more time per draft (5-7 min substantive
        vs 3-4 min daily). Goldilocks per-proposal still holds (ONE module
        per draft).

        BUDGET: 60-90 min.
    description: "Tue 09:00 weekly module-progress deep drafting — one module per week, up to 3 supporting cascade-candidates for that module."
    timeout_seconds: 5400

# =============================================================================
# Cron design rules (this Profile v3)
# =============================================================================
# 1. 3 jobs (down from v1's 6). No hardcoded sprint-tick — sprint = operator-
#    invoked mode, picked up at step 1 branch.
# 2. NO hardcoded date windows. Sprint is content-of-operator-directives.md,
#    not a schedule.
# 3. NO every:3m cadence. Operator-verbatim 2026-05-16: "PUT IT EVERY 3min
#    if we need" — IF needed, i.e., when operator invokes sprint, NOT default.
# 4. ALL jobs autonomous (enabled: true). Operator can disable via _state
#    file or by editing this cron.yaml.
# 5. Each tick processes operator-directives FIRST (step 0).
# 6. R20 sacrosanct enforced at step 7 in every workflow path.
# 7. NO auto-promotion. NO cross-project edits. NO scope-decisions in drafts.
# 8. Anti-freeze / anti-slow / anti-stop apply throughout (not just sprint).
#    Goldilocks scales: 0-1 steady → 1-2 fresh → 1-3 sprint.
# =============================================================================
