# =============================================================================
# .assistant/continuous-research.cron.yaml
# =============================================================================
# Per-profile CRON jobs for the Continuous Research assistant.
# Per operator 2026-05-09 turn 7 (sacrosanct, verbatim):
#   "list of CRON jobs that can be enabled or disabled and configured by AI
#   assistant profile to enable other per-profile specific or even other global
#   CRON jobs which can enable for example noticing certain delta and stuff like
#   that or morning or evening tasks or start of week and end of week tasks and
#   so on."
#
# Each job: enabled (toggle) · schedule (systemd-timer OnCalendar syntax) ·
# trigger (what the assistant DOES when fired) · description (what + why).
#
# Enable a job:  `tools/assistant cron enable continuous-research <job-name>`
# Disable a job: `tools/assistant cron disable continuous-research <job-name>`
# List jobs:     `tools/assistant cron list continuous-research`
# Install timers: `tools/assistant cron install continuous-research`
#                  (creates systemd .timer units that fire the agent's
#                   scheduled-task entry point)
# =============================================================================

profile: continuous-research

jobs:

  # ─── Hourly: research the frontier AND do the work ────────────────────
  - name: frontier-delta-check
    enabled: true
    schedule: "hourly"
    trigger:
      type: openclaw-task
      prompt: |
        Operator-stated job (verbatim, sacrosanct): "Do research to make sure
        the models are up to date and our vision of the technogies are still
        acquire, AND WE DO THE PROPER UPDATE AND ETC..."

        This is NOT a surfacing-only task. The "proper update" part is
        load-bearing — you ACTUALLY do the work, you don't write diary entries
        deferring to a hypothetical future run.

        Workflow per tick:

        0. **Operator-directives check (FIRST thing on wake).** Read
           .assistant/_state/continuous-research-operator-directives.md (if it
           exists). This is the operator-write surface; you NEVER replace its
           body, only APPEND `> [!processed]` markers below directives you
           handle. Look for:

           a. `> [!directive]` callouts NOT already followed by `> [!processed]`.
              For each, process WITHIN your autonomy bounds (AUTONOMY.md). If
              the directive falls in surfacing_required territory, append a
              `> [!info]` follow-up explaining what would need to happen +
              budget estimate, then append `> [!processed]` to mark it handled.

           b. `> [!resolved] Q##` callouts. These represent operator decisions
              on past promotion candidates — DO NOT re-surface these Q numbers
              in future ticks. Remember them across the session.

           NEVER overwrite or delete content in this file. Only append.

           After step 0, proceed with normal scan workflow:

        1. Scan monitoring_surfaces (Anthropic news, OpenAI announcements,
           HF trending models/papers, GitHub trending AI). Use web_search (Hard
           Rule 6: NEVER WebFetch on corpus URLs).

        2. For each candidate novelty:
           a. Use wiki_search to confirm not already in the project's corpus
           b. If genuinely novel AND vision-relevant (touches model tiers,
              vendor policy, operator's stack, agent runtimes, hardware):
              → EXECUTE on_significant_change_detected per AGENTS.md:
                 - pipeline_fetch the source URL(s) into raw/
                 - read the raws IN FULL (Hard Rule 1; wc -l first)
                 - author wiki/sources/<domain>/src-<slug>.md per template
                   (≥0.25 ratio, 9 frontmatter fields, required sections)
                 - run pipeline_crossref to link to existing pages
                 - flag affected existing pages (e.g. comparison tables,
                   smoke-test task lists) — author follow-up entry in
                   wiki/log/ identifying which pages to update
                 - pipeline_post — 0 errors required
           c. If not novel OR not vision-relevant: skip; don't log it.

        3. After step 2 lands cleanly (synthesis + crossref + pipeline_post 0-error),
           PURGE ephemeral raws per LIFECYCLE.md. For each raw you just synthesized:
           if its path is `raw/articles/` AND no `lifecycle: keep` frontmatter AND
           ratio ≥0.25 AND domain not on always_keep list → `rm` the raw and log
           it to wiki/log/<date>-purge-summary.md (purged path, synthesis path,
           ratio, rationale). Don't flood the project with extracted noise.

        4. If any synthesis you just authored suggests a promotion candidate
           (lesson / pattern / decision / principle / model-update) — surface it
           to wiki/backlog/operator-decision-queue.md per AUTONOMY.md candidate
           format. NEVER promote autonomously. ≥3 convergent existing wiki
           sources is the lesson-promotion floor.

        5. Append ONE LINE to .assistant/_state/continuous-research-inbox.md
           reporting what you actually did this tick. Format:
             HH:MM ET | <raws_fetched> fetched | <syntheses> synth | <crossrefs> xrefs | <purged> purged | <promo-candidates> promo | post: <ok|err>
           If counts are all 0, write:
             HH:MM ET | nothing significant — N surfaces scanned, all known
           NO diary entries for "I noted these but deferred" — silent tyranny.
           Log to wiki/log/ ONLY if you actually did substantive work.

        4. If the scan finds significant novelty AND you can't process it
           all in this tick (e.g., 5+ deltas), do at LEAST the highest-impact
           ONE end-to-end, log a hand-off identifying the rest by URL +
           rationale, AND surface it in operator-decision-queue.md so the
           operator knows.

        Budget: target up to 5 minutes model time per tick. If you find
        nothing significant, you're done in ~30 seconds. If you find one,
        do the work.

        ANTI-PATTERN: writing a research-watch log that says "I found these
        items, deferring full synthesis." Don't. Either you did the work, or
        you didn't surface it.
    description: "Hourly frontier research — finds novelty, authors source-synthesis, cross-references, flags affected pages. NOT a surfacing-only scan."
    timeout_seconds: 900  # 15 min — synthesis (read raw, author 300+ line page, crossref, post) typically 4-10 min

  # ─── Morning task: daily-startup scan ─────────────────────────────────
  - name: morning-scan
    enabled: true
    schedule: "*-*-* 08:00:00"    # daily at 08:00
    trigger:
      type: openclaw-task
      prompt: |
        Daily morning scan. Process the past 16 hours of frontier-delta-check
        findings (since yesterday evening). Author any new source-synthesis
        pages needed. Surface a single "morning brief" entry in
        wiki/log/<date>-research-watch-morning.md summarizing what changed
        overnight and what (if anything) needs operator-decision-queue attention.
    description: "Daily morning brief — overnight delta synthesis + operator-decision-queue triage."
    timeout_seconds: 1800  # 30 min — batch processes overnight backlog of multiple deltas

  # ─── Evening task: end-of-day report ──────────────────────────────────
  - name: evening-report
    enabled: true
    schedule: "*-*-* 20:00:00"    # daily at 20:00
    trigger:
      type: openclaw-task
      prompt: |
        End-of-day report. Summarize the day's frontier findings + source-synthesis
        pages authored + stale-claim flags raised. Write a wiki/log/<date>-research-watch-evening.md
        summary. Surface any items that became newly urgent for operator review
        (e.g., a strategic shift that emerged from cumulative findings).
    description: "Daily evening summary — cumulative frontier findings + urgent items for operator review."
    timeout_seconds: 900  # 15 min — daily summary work

  # ─── Weekly start: deep monday dive ───────────────────────────────────
  - name: start-of-week-deep-dive
    enabled: true
    schedule: "Mon *-*-* 09:00:00"  # Monday at 09:00
    trigger:
      type: openclaw-task
      prompt: |
        Start-of-week deep-dive. Read the past 7 evening-reports. Identify
        cross-day patterns. Synthesize a wiki/log/<date>-weekly-frontier-deep-dive.md
        page that elevates any pattern to candidate lesson/decision territory.
        Update vision_baselines_to_track if any baseline appears outdated.
        Surface to operator-decision-queue.md for items requiring operator review.
    description: "Weekly Monday deep-dive — pattern extraction from last week's daily findings."
    timeout_seconds: 2400  # 40 min — reads 7 evening-reports + synthesizes cross-day patterns

  # ─── Weekly end: friday digest ────────────────────────────────────────
  - name: end-of-week-summary
    enabled: true
    schedule: "Fri *-*-* 17:00:00"  # Friday at 17:00
    trigger:
      type: openclaw-task
      prompt: |
        End-of-week digest. Summarize the week's research output: count of
        new source-syntheses, count of stale-claim flags raised + operator-accept-rate,
        any vision baseline updates. Author wiki/log/<date>-weekly-research-digest.md
        with metrics + narrative. Flag any anti-signals (Profile.success_criteria.anti_signals_to_watch)
        observed this week.
    description: "Weekly Friday digest — research output metrics + anti-signal surfacing."
    timeout_seconds: 1800  # 30 min — weekly digest writing

  # ─── Monthly: budget audit ────────────────────────────────────────────
  - name: monthly-budget-audit
    enabled: true
    schedule: "*-*-01 12:00:00"   # 1st of each month at noon
    trigger:
      type: openclaw-task
      prompt: |
        Monthly budget audit. Estimate this Profile's value-output for the month
        vs Profile.model_routing.cost_ceilings.target_monthly_value_output_usd_equivalent.
        If under target, why? If over hard_stop, alert. Report to wiki/log/.
    description: "Monthly cost/value audit per Profile.success_criteria.measurable_value_per_month."
    timeout_seconds: 600  # 10 min — read run logs + tally + write audit page

# =============================================================================
# Job-design rules
# =============================================================================
# 1. Each job is OFF by default (`enabled: false`) — operator opts in.
# 2. Schedules use systemd OnCalendar syntax (man systemd.time).
# 3. Triggers are abstract; the consuming runtime (OpenClaw / Multica / etc.)
#    translates `type` + `prompt` into its native invocation.
# 4. Heavy jobs (deep-dive, summary) should respect the Profile's cost ceiling.
# 5. Per Profile.action_surface, jobs may NOT auto-promote maturity tiers or
#    write to operator-territory files. They surface; operator decides.
